name: Refresh Tilak Varma news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/newsreader.py"
      - "scripts/filter_tilak_news.py"
      - "scripts/news_content_formatter.py"
      - "scripts/test_news_content_formatter.py"
      - "scripts/news_pipeline_fixer.py"
      - "scripts/news_pipeline_manager.py"
      - "admin/sections/news/news-pipeline-manager.js"
      - "scripts/news.py"
      - "scripts/cleanup_raw_news.py"
      - ".github/workflows/refresh-tilak-news.yml"
  schedule:
    - cron: "23 2 * * *"
    - cron: "23 14 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-tilak-news
  cancel-in-progress: false
jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check pipeline scripts
        run: |
          python -m compileall -q scripts
      - name: Test BCCI table formatting regressions
        run: |
          python -m unittest scripts.test_news_content_formatter -v
      - name: Fetch BCCI News API pages only
        run: |
          python scripts/news.py
          python -m json.tool News/raw-news-pages.json > /dev/null
          cp News/raw-news-pages.json /tmp/tilak-raw-news-pages.json
      - name: Merge unique stories and push without losing concurrent commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other workflows also write to main. Always rebuild the filtered archive
          # on top of the latest main instead of rebasing a stale newsjson commit.
          for attempt in 1 2 3 4 5; do
            echo "News push attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tilak-raw-news-pages.json News/raw-news-pages.json

            # newsreader merges with the current main archive and removes URL/title duplicates.
            python scripts/newsreader.py
            python -m json.tool News/raw-news-pages.json > /dev/null
            python scripts/filter_tilak_news.py
            python scripts/news_pipeline_fixer.py
            python scripts/news_content_formatter.py
            python -m json.tool News/raw-news-pages.json > /dev/null
            python -m json.tool News/newsjson.json > /dev/null
            python scripts/cleanup_raw_news.py
            python scripts/news_pipeline_manager.py
            python -m json.tool News/news-pipeline-report.json > /dev/null
            python -m json.tool News/raw-news-pages.json > /dev/null
            python -m json.tool News/newsjson.json > /dev/null

            # Verify the published snapshot has required fields and no duplicate IDs/URLs.
            python - <<'PY'
            import json
            from pathlib import Path

            path = Path("News/newsjson.json")
            data = json.loads(path.read_text(encoding="utf-8"))
            records = data.get("news", []) if isinstance(data, dict) else data
            if not isinstance(records, list):
                raise SystemExit("News snapshot must contain a list of stories")
            ids, urls = set(), set()
            for index, item in enumerate(records):
                if not isinstance(item, dict):
                    raise SystemExit(f"News record {index} is not an object")
                if not str(item.get("title", "")).strip():
                    raise SystemExit(f"News record {index} has no title")
                url = str(item.get("webviewUrl") or item.get("finalUrl") or "").strip()
                if item.get("manual") is not True and not url.startswith("https://www.bcci.tv/"):
                    raise SystemExit(f"News record {index} has an invalid BCCI URL")
                item_id = str(item.get("id") or "").strip()
                if item_id and item_id in ids:
                    raise SystemExit(f"Duplicate news ID: {item_id}")
                if url and url in urls:
                    raise SystemExit(f"Duplicate news URL: {url}")
                if item_id:
                    ids.add(item_id)
                if url:
                    urls.add(url)
            if isinstance(data, dict) and data.get("matchedCount") != len(records):
                raise SystemExit("matchedCount does not match the actual news record count")
            print(f"News integrity check passed: {len(records)} records, {len(ids)} IDs, {len(urls)} URLs")
            PY

            NEWS_BYTES=$(wc -c < News/newsjson.json)
            echo "Filtered news archive size: $NEWS_BYTES bytes"
            if [ "$NEWS_BYTES" -ge 20000000 ]; then
              echo "::error::News archive is still too large for Cloudflare Pages. Refusing to publish."
              exit 1
            fi

            git add News/raw-news-pages.json News/newsjson.json News/news-pipeline-report.json
            if git diff --cached --quiet; then
              echo "News archive is already current; no commit required."
              exit 0
            fi

            git commit -m "chore: refresh unique Tilak Varma news snapshot"
            if git push origin HEAD:main; then
              echo "News snapshots pushed successfully."
              exit 0
            fi

            echo "main moved during this attempt; reloading latest main and rebuilding the merge."
            sleep 2
          done

          echo "::error::Could not push news snapshots after 5 attempts. Existing main data was preserved."
          exit 1
