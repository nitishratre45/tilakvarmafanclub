name: Validate Admin Studio and Site Data

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "admin/**"
      - "data/admin-media.json"
      - "data/video-config.json"
      - "assets/bcci-videos.js"
      - "assets/bcci-videos.json"
      - "scripts/refresh_bcci_videos.py"
      - ".github/workflows/refresh-bcci-videos.yml"
      - "scripts/refresh_statsguru.py"
      - ".github/workflows/validate-admin-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Cloudflare Pages Function syntax
        run: |
          node --input-type=module --check < functions/_lib/admin.js
          node --input-type=module --check < functions/api/admin/login.js
          node --input-type=module --check < functions/api/admin/sign-upload.js
          node --input-type=module --check < functions/api/admin/content.js
          node --input-type=module --check < functions/api/admin/data-status.js
          node --input-type=module --check < functions/api/admin/monitor.js
          node --input-type=module --check < functions/api/admin/session.js
      - name: Check inline Admin Studio JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("admin/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline Admin Studio script found")
          Path("/tmp/admin-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/admin-inline.js
      - name: Check data JSON
        run: |
          python -m json.tool data/admin-media.json > /dev/null
          python -m json.tool data/video-config.json > /dev/null
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool assets/bcci-videos.json > /dev/null
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          feed = json.loads(Path("assets/bcci-videos.json").read_text(encoding="utf-8"))
          videos = feed.get("videos", [])
          if not videos:
              raise SystemExit("BCCI video feed is empty")
          invalid = []
          for item in videos:
              url = urlparse(str(item.get("playbackUrl", "")))
              if url.scheme != "https" or not url.hostname or not url.path.lower().endswith((".m3u8", ".mpd", ".mp4")):
                  invalid.append(str(item.get("id") or item.get("title") or "unknown"))
          if invalid:
              raise SystemExit("Published videos without direct HTTPS playback URLs: " + ", ".join(invalid[:10]))
          admin = Path("admin/index.html").read_text(encoding="utf-8")
          css = Path("admin/assets/admin.css").read_text(encoding="utf-8")
          mobile_nav = Path("admin/assets/admin-mobile-nav.js").read_text(encoding="utf-8")
          for required in ("sections/overview/overview.css", "sections/media/media.css", "sections/matches/matches.css", "sections/services-security/services.css"):
              if required not in admin:
                  raise SystemExit(f"Missing admin section stylesheet link: {required}")
          if 'id="admin-nav"' not in admin or 'id="admin-mobile-bottom-nav"' not in admin:
              raise SystemExit("Desktop or mobile Admin navigation container is missing")
          if ".admin-mobile-bottom-nav" not in css or "@media (min-width: 721px)" not in css:
              raise SystemExit("Responsive desktop/mobile Admin navigation CSS is missing")
          if "desktopNav.querySelectorAll" not in mobile_nav or "syncActive" not in mobile_nav:
              raise SystemExit("Mobile Admin navigation does not clone and sync desktop sections")
          if "assets/admin-core.js" not in admin or "sections/matches/matches-manager.js" not in admin or "sections/news/news-pipeline-manager.js" not in admin:
              raise SystemExit("Required Admin logic scripts are not linked")
          print(f"Validated {len(videos)} BCCI videos, section CSS links, and responsive Admin navigation.")
          PY
      - name: Compile refresh script
        run: python -m py_compile scripts/refresh_statsguru.py scripts/refresh_bcci_videos.py
      - name: Ensure admin password is not hard-coded in public files
        run: |
          if grep -R -n --exclude='ADMIN_SETUP.md' --exclude-dir='.git' 'nitish7272' admin assets index.html functions data; then
            echo "Admin password must not be committed to public source."
            exit 1
          fi
