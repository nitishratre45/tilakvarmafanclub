name: BCCI Match Squads Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "bcci-fixtures-test/fetch_bcci_squads.py"
      - ".github/workflows/bcci-squads-refresh.yml"

permissions:
  contents: write

concurrency:
  group: bcci-squads-refresh
  cancel-in-progress: false

jobs:
  refresh-squads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate fetcher and fixture JSON
        run: |
          python -m py_compile bcci-fixtures-test/fetch_bcci_squads.py
          python -c "import json; p=json.load(open('bcci-fixtures-test/bcci-fixtures.json', encoding='utf-8')); assert p.get('status') == 'ok'; m=(p.get('data') or {}).get('match') or []; assert isinstance(m, list) and m; print(f'Validated {len(m)} fixtures')"

      - name: Fetch official squads for each fixture
        env:
          ELIPSE_EDAK: ${{ secrets.ELIPSE_EDAK }}
        run: python bcci-fixtures-test/fetch_bcci_squads.py

      - name: Validate every squad snapshot before publishing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("bcci-fixtures-test/squads").glob("*.json"))
          assert files, "No squad JSON snapshots were generated"
          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("status") == "ok", f"{path.name}: status is not ok"
              assert str(payload.get("match_id", "")) == path.stem, f"{path.name}: match ID does not match filename"
              assert isinstance(payload.get("match"), dict), f"{path.name}: match metadata missing"
              teams = payload.get("teams")
              assert isinstance(teams, dict), f"{path.name}: teams object missing"
              for side in ("team1", "team2"):
                  team = teams.get(side)
                  assert isinstance(team, dict) and team.get("team_id"), f"{path.name}: {side} identity missing"
                  assert isinstance(team.get("response"), (dict, list)) and team.get("response"), f"{path.name}: {side} response is empty"
              assert str(payload.get("source", "")).startswith("https://epr.ellipsedata.com/"), f"{path.name}: unexpected source"
          print(f"Validated {len(files)} BCCI match squad snapshots.")
          PY

      - name: Commit updated match squad snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bcci-fixtures-test/squads
          if git diff --cached --quiet; then
            echo "No squad JSON changes to commit."
            exit 0
          fi
          git commit -m "Refresh BCCI match squads"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Squad snapshot rebase conflicted; refusing to publish an unverified merge."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published validated BCCI squad snapshots."
              exit 0
            fi
            echo "Concurrent main update detected; retrying safely (attempt $attempt/4)."
            sleep $((attempt * 2))
          done
          echo "::error::Unable to publish BCCI squad snapshots after four retries."
          exit 1
