name: Validate Tilak Varma FC site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home/**'
      - 'assets/**'
      - 'News-details/**'
      - 'News/**'
      - 'functions/**'
      - 'admin/**'
      - 'tests/**'
      - 'death-overs/**'
      - 'stats/**'
      - 'matches/**'
      - 'bcci-fixtures-test/**'
      - 'photos/**'
      - 'news/**'
      - 'videos/**'
      - 'records/**'
      - 'sw.js'
      - 'manifest.json'
      - 'data/**.json'
      - '!data/repo-health.json'
      - '!data/automation-repo-monitor.json'
      - '!data/job-recovery-manager.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Safe auto-repair PRs already run deterministic syntax/data checks in self-healing.yml.
    # Skip redundant PR-triggered jobs for github-actions[bot] to avoid approval-gated action_required runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and embedded page scripts
        run: |
          find assets functions admin News News-details home death-overs stats matches bcci-fixtures-test photos news videos records -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          python -m py_compile scripts/refresh_icc_records.py scripts/refresh_statsguru.py
          python - <<'PY'
          from pathlib import Path
          html = Path("death-overs/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("No embedded Death Overs script found")
          Path("/tmp/death-overs-inline.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/death-overs-inline.js
          python -m compileall -q scripts bcci-fixtures-test
      - name: Validate JSON data
        run: |
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null || exit 1
          done
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          career = data.get("careerStats", {})
          t20i = data.get("statsguru", {}).get("formats", {}).get("T20I", {}).get("summary", {})
          for key in ("t20iRuns", "highestScore", "average", "strikeRate", "fifties", "hundreds"):
              source_key = {"t20iRuns": "runs"}.get(key, key)
              if career.get(key) != t20i.get(source_key):
                  raise SystemExit(
                      f"Career snapshot mismatch: careerStats.{key}={career.get(key)!r}, "
                      f"ESPNcricinfo Statsguru T20I {source_key}={t20i.get(source_key)!r}"
                  )

          for row in data.get("recentInnings", []):
              source = str(row.get("source", ""))
              if "icc-cricket.com/rankings/" in source:
                  raise SystemExit(
                      f"Recent innings must link to a match-level source, not an ICC rankings page: {row.get('date')}"
                  )
              runs, balls, strike_rate = row.get("runs"), row.get("balls"), row.get("strikeRate")
              if isinstance(runs, (int, float)) and isinstance(balls, (int, float)) and balls > 0:
                  calculated = round(runs * 100 / balls, 2)
                  if isinstance(strike_rate, (int, float)) and abs(strike_rate - calculated) > 0.02:
                      raise SystemExit(
                          f"Recent innings strike-rate mismatch for {row.get('date')} vs "
                          f"{row.get('opposition')}: saved {strike_rate}, calculated {calculated}"
                      )

          bowling = data.get("bowlingStats", {}).get("formats", {})
          for fmt, entry in bowling.items():
              summary = entry.get("summary")
              if not summary:
                  continue
              balls, overs = summary.get("balls"), summary.get("overs")
              if isinstance(balls, (int, float)) and isinstance(overs, (int, float)):
                  # Cricket overs use base-6 notation: 10.3 means 10 overs and 3 balls.
                  whole, fraction = divmod(round(overs * 10), 10)
                  if fraction > 5 or whole * 6 + fraction != balls:
                      raise SystemExit(
                          f"Bowling overs/balls mismatch for {fmt}: {overs} overs, {balls} balls"
                      )

          fielding = data.get("fieldingStats", {}).get("formats", {})
          for fmt, entry in fielding.items():
              summary = entry.get("summary", {})
              rows = entry.get("innings", [])
              if not summary:
                  continue
              for key in ("matches", "catches", "stumpings", "runOuts", "dismissals"):
                  if summary.get(key) is not None and int(summary[key]) < 0:
                      raise SystemExit(f"Invalid fielding total {fmt}.{key}")
              if isinstance(rows, list):
                  for key in ("catches", "stumpings", "runOuts", "dismissals"):
                      saved = summary.get(key)
                      if saved is None:
                          continue
                      actual = sum(int(row.get(key, 0) or 0) for row in rows)
                      if actual != int(saved):
                          raise SystemExit(
                              f"Fielding mismatch for {fmt}.{key}: summary={saved}, innings sum={actual}"
                          )
          for fmt, entry in data.get("careerFormats", {}).items():
              t20i_summary = data.get("statsguru", {}).get("formats", {}).get("T20I", {}).get("summary", {})
              if fmt == "T20I" and entry.get("runs") is not None and entry["runs"] != t20i_summary.get("runs"):
                  raise SystemExit("careerFormats.T20I runs do not match the ESPNcricinfo Statsguru snapshot")

          death = json.loads(Path("data/death-overs.json").read_text(encoding="utf-8"))
          if not isinstance(death.get("innings"), list) and not isinstance(death.get("formats"), dict):
              raise SystemExit("Death Overs data must expose innings or format datasets")
          if not death.get("updatedAt"):
              raise SystemExit("Death Overs data is missing updatedAt")
          print("Cross-checked career snapshot, recent strike rates, bowling overs and archive timestamps.")
          PY
      - name: Check page anchors and local asset references
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          pages = (Path("index.html"), Path("stats/index.html"), Path("death-overs/index.html"), Path("matches/index.html"), Path("matches/complete/index.html"), Path("matches/scorecards/index.html"), Path("bcci-fixtures-test/index.html"), Path("bcci-fixtures-test/fixtures.html"), Path("bcci-fixtures-test/scorecard.html"), Path("bcci-fixtures-test/bcci-scorecard-page.html"), Path("bcci-fixtures-test/complete/index.html"), Path("photos/index.html"), Path("records/index.html"), Path("news/index.html"), Path("videos/index.html"))
          for page in pages:
              source = page.read_text(encoding="utf-8")
              ids = re.findall(r"""id=[\"']([^\"']+)[\"']""", source)
              duplicates = sorted(value for value, count in Counter(ids).items() if count > 1)
              if duplicates:
                  raise SystemExit(f"{page} has duplicate IDs: {duplicates}")

              targets = set(ids)
              hashes = re.findall(r"""href=[\"']#([^\"']+)[\"']""", source)
              missing = sorted(set(hashes) - targets)
              if missing:
                  raise SystemExit(f"{page} links to missing anchors: {missing}")

              for ref in re.findall(r"""(?:src|href)=[\"']([^\"']+)[\"']""", source):
                  parsed = urlsplit(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith("#") or not parsed.path:
                      continue
                  # Root-relative URLs such as /manifest.json resolve from the repository root on Pages, not the runner filesystem root.
                  target = (Path(".") / parsed.path.lstrip("/")).resolve() if parsed.path.startswith("/") else (page.parent / parsed.path).resolve()
                  if not target.exists():
                      raise SystemExit(f"{page} references missing local asset: {ref}")
              print(f"Validated IDs, anchors and local assets in {page}.")
          PY
      - name: Verify feature modules are linked
        run: |
          set -euo pipefail
          require_match() {
            local pattern="$1" file="$2"
            if ! grep -Eq "$pattern" "$file"; then
              echo "::error file=$file::Expected pattern not found: $pattern"
              exit 1
            fi
          }
          # Accept cache-busted script URLs and whitespace/attribute formatting.
          require_match 'records/features[.]js([?"]|$)' records/index.html
          require_match 'records/records-matches[.]js([?"]|$)' records/index.html
          require_match 'news/news[.]js([?"]|$)' news/index.html
          require_match 'news/news[.]css([?"]|$)' news/index.html
          require_match 'videos/videos[.]js([?"]|$)' videos/index.html
          require_match 'videos/videos[.]css([?"]|$)' videos/index.html
          require_match 'stats/statsguru[.]js([?"]|$)' stats/index.html
          require_match 'home/home-snapshot[.]js([?"]|$)' index.html
          require_match 'stats/bowling[.]js([?"]|$)' stats/index.html
          require_match 'data-bowling-format="List A"' stats/index.html
          require_match 'data-bowling-format="FC"' stats/index.html
          require_match 'id="home-snapshot"' index.html
          require_match 'data-stats-tab="statsguru"' stats/index.html
          require_match 'id="icc-ranking-t20i"' index.html
          require_match 'id="icc-record-highlights"' records/index.html
          require_match 'scripts/refresh_icc_records[.]py' .github/workflows/refresh-icc-records.yml
          require_match 'scripts/refresh_statsguru[.]py' .github/workflows/refresh-statsguru.yml
          if grep -Eq 'id="activity"|href="#activity"' index.html; then echo "::error::Updates section should be removed"; exit 1; fi
          require_match 'tv-news-grid' news/news.js
          require_match 'News/newsjson[.]json' news/news.js
          require_match 'News-details/index[.]html' news/news.js
          require_match 'scripts/news[.]py' .github/workflows/refresh-tilak-news.yml
          require_match 'scripts/filter_tilak_news[.]py' .github/workflows/refresh-tilak-news.yml
          # Shared site-data loader must exist and load before every dependent page module.
          grep -q 'assets/site-data-store.js' index.html
          grep -q 'window.TilakSiteData = Object.freeze({ load })' assets/site-data-store.js
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          loader = html.find('src="assets/site-data-store.js')
          if loader < 0:
              raise SystemExit("Shared site-data loader is not linked from index.html")
          dependents = [
              "/home/app.js",
              "/home/upgrade.js",
              "/home/home-snapshot.js",
          ]
          for script in dependents:
              position = html.find('src="' + script)
              if position < 0:
                  raise SystemExit("Required data module is not linked: " + script)
              if loader > position:
                  raise SystemExit("Shared data loader must precede " + script)
          print("Validated shared data loader order for all dependent modules.")

          records = Path("records/index.html").read_text(encoding="utf-8")
          records_loader = records.find('src="/assets/site-data-store.js')
          for script in ("/records/records-matches.js", "/records/features.js"):
              position = records.find('src="' + script)
              if position < 0 or records_loader < 0 or records_loader > position:
                  raise SystemExit("Records page is missing a correctly ordered module: " + script)
          news = Path("news/index.html").read_text(encoding="utf-8")
          for asset in ("/news/news.js", "/news/news.css"):
              if asset not in news:
                  raise SystemExit("News page is missing required asset: " + asset)
          videos = Path("videos/index.html").read_text(encoding="utf-8")
          for asset in ("/videos/videos.js", "/videos/videos.css"):
              if asset not in videos:
                  raise SystemExit("Videos page is missing required asset: " + asset)
          print("Validated modular Records, News and Videos routes.")

          matches = Path("matches/index.html").read_text(encoding="utf-8")
          for script in ("/assets/site-data-store.js", "/matches/match-centre.js"):
              if script not in matches:
                  raise SystemExit(f"Matches page is missing required script: {script}")
          required_mounts = ('id="match-upcoming-panel"', 'id="upcoming-matches-list"', 'id="match-tab-upcoming"', 'id="match-tab-complete"', 'href="/matches/complete/"')
          if any(mount not in matches for mount in required_mounts):
              raise SystemExit("Matches page is missing Upcoming mounts or the dedicated Complete Match route")
          complete = Path("matches/complete/index.html").read_text(encoding="utf-8")
          for asset in ("/matches/complete/complete.css", "/matches/complete/complete.js"):
              if asset not in complete:
                  raise SystemExit("Dedicated Complete Match page is missing required asset: " + asset)
          complete_js = Path("matches/complete/complete.js").read_text(encoding="utf-8")
          if "/matches/scorecards/?match=" not in complete_js:
              raise SystemExit("Complete Match cards must link to the dedicated Scorecards page")
          if 'id="complete-matches-list"' not in complete or 'id="match-complete-panel"' in matches:
              raise SystemExit("Complete Match data mount must live only on matches/complete/index.html")
          print("Validated isolated Upcoming and Complete Match pages.")
          home = Path("index.html").read_text(encoding="utf-8")
          if 'id="innings"' in home or 'id="upcoming-matches-list"' in home or 'id="player-matches-table"' in home:
              raise SystemExit("Match section should live only in matches/index.html")
          photos = Path("photos/index.html").read_text(encoding="utf-8")
          for asset in ("/photos/gallery.js", "/photos/gallery.css", "/photos/photos.css", "/data/admin-media.json"):
              if asset not in photos and asset != "/data/admin-media.json":
                  raise SystemExit(f"Photos page is missing required asset: {asset}")
          if 'id="tv-gallery-grid"' not in photos or 'id="tv-gallery-hub"' not in photos:
              raise SystemExit("Photos page is missing the gallery mount points")
          home = Path("index.html").read_text(encoding="utf-8")
          if 'id="tv-gallery-hub"' in home or 'id="tv-gallery-grid"' in home:
              raise SystemExit("Photos section should live only in photos/index.html")
          stats = Path("stats/index.html").read_text(encoding="utf-8")
          stats_loader = stats.find('src="/assets/site-data-store.js')
          if stats_loader < 0:
              raise SystemExit("Shared site-data loader is not linked from stats/index.html")
          for script in ("/stats/app.js", "/stats/career-formats.js", "/stats/statsguru.js", "/stats/bowling.js"):
              position = stats.find('src="' + script)
              if position < 0:
                  raise SystemExit("Required Stats page module is not linked: " + script)
              if stats_loader > position:
                  raise SystemExit("Stats data loader must precede " + script)
          print("Validated dedicated Stats page module links and load order.")
          PY
