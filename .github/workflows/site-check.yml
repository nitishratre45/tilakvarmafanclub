name: Validate Tilak Varma FC site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/**'
      - 'assets/**'
      - 'data/**.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auto-repair known escaped-newline typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("assets/admin.js")
          text = p.read_text(encoding="utf-8")
          bad = r');\n      Object.entries(data.formats'
          good = ');\n      Object.entries(data.formats'
          if bad in text:
              p.write_text(text.replace(bad, good), encoding="utf-8")
              print("Repaired known escaped-newline issue in Admin Studio.")
          else:
              print("No known safe auto-repair needed.")
          PY
          if ! git diff --quiet -- assets/admin.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/admin.js
            git commit -m "fix: auto-repair known Admin Studio syntax issue [skip ci]"
            git push
          fi
      - name: Check JavaScript and embedded page scripts
        run: |
          node --check assets/app.js
          node --check assets/features.js
          node --check assets/admin.js
          node --check assets/upgrade.js
          python - <<'PY'
          from pathlib import Path
          html = Path("death-overs/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("No embedded Death Overs script found")
          Path("/tmp/death-overs-inline.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/death-overs-inline.js
          python -m compileall -q scripts
      - name: Validate JSON data
        run: |
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/death-overs.json > /dev/null
          python -m json.tool data/fan-zone.json > /dev/null
      - name: Verify feature modules are linked
        run: |
          grep -q 'assets/features.js' index.html
          grep -q 'data/fan-zone.json' assets/features.js
          grep -q 'data/fan-zone.json' admin/index.html
