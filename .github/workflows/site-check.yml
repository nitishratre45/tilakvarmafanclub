name: Validate Tilak Varma FC site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and embedded page scripts
        run: |
          node --check assets/app.js
          node --check assets/features.js
          node --check assets/upgrade.js
          node --check assets/news.js
          node --check assets/statsguru.js
          node --check assets/home-snapshot.js
          node --check assets/section-tabs.js
          node --check assets/bowling.js
          python -m py_compile scripts/refresh_icc_records.py scripts/refresh_statsguru.py
          python - <<'PY'
          from pathlib import Path
          html = Path("death-overs/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("No embedded Death Overs script found")
          Path("/tmp/death-overs-inline.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/death-overs-inline.js
          python -m compileall -q scripts
      - name: Validate JSON data
        run: |
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/death-overs.json > /dev/null
          python -m json.tool data/fan-zone.json > /dev/null
          python -m json.tool data/tilak-news.json > /dev/null
      - name: Verify feature modules are linked
        run: |
          grep -q 'assets/features.js' index.html
          grep -q 'assets/news.js' index.html
          grep -q 'assets/statsguru.js' index.html
          grep -q 'assets/home-snapshot.js' index.html
          grep -q 'assets/section-tabs.js' index.html
          grep -q 'assets/bowling.js' index.html
          grep -q 'data-bowling-format="List A"' index.html
          grep -q 'data-bowling-format="FC"' index.html
          grep -q 'id="home-snapshot"' index.html
          grep -q 'data-stats-tab="statsguru"' index.html
          grep -q 'id="icc-ranking-t20i"' index.html
          grep -q 'id="icc-record-highlights"' index.html
          grep -q 'scripts/refresh_icc_records.py' .github/workflows/refresh-icc-records.yml
          grep -q 'scripts/refresh_statsguru.py' .github/workflows/refresh-statsguru.yml
          if grep -q 'id="activity"\|href="#activity"' index.html; then echo "Updates section should be removed"; exit 1; fi
          grep -q 'tilak-news-grid' index.html
          grep -q 'scripts/refresh_tilak_news.py' .github/workflows/refresh-tilak-data.yml
          grep -q 'data/fan-zone.json' assets/features.js
