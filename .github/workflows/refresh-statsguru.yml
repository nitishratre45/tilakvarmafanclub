name: Refresh ESPNcricinfo Statsguru

on:
  workflow_dispatch:
  schedule:
    # Run at 00:23 and 12:23 UTC; the rolling interval guard remains as a safety check.
    - cron: "23 */12 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_statsguru.py"
      - "scripts/refresh_ipl_explorer.py"
      - ".github/workflows/refresh-statsguru.yml"

permissions:
  contents: write

concurrency:
  group: refresh-statsguru
  cancel-in-progress: false

jobs:
  refresh-statsguru:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Statsguru and IPL refresh scripts
        run: python -m py_compile scripts/refresh_statsguru.py scripts/refresh_ipl_explorer.py
      - name: Check 12-hour refresh interval
        id: refresh_due
        if: github.event_name == 'schedule'
        run: |
          python -c 'import json,os; from datetime import datetime,timezone; from pathlib import Path; d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8")); raw=d.get("statsguru",{}).get("iplUpdatedAt"); last=datetime.strptime(raw,"%Y-%m-%d %H:%M UTC").replace(tzinfo=timezone.utc) if raw else None; due=last is None or (datetime.now(timezone.utc)-last).total_seconds() >= 43200; open(os.environ["GITHUB_OUTPUT"],"a").write("run_refresh="+("true" if due else "false")+"\n"); print("12-hour refresh due:",due,"last IPL update:",raw)'
      - name: Commit updated Statsguru snapshot
        if: github.event_name != 'schedule' || steps.refresh_due.outputs.run_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/refresh_statsguru.py
            python -u scripts/refresh_ipl_explorer.py
            python -m json.tool data/site-data.json > /dev/null
            python -c "import json; from pathlib import Path; d=json.loads(Path('data/site-data.json').read_text(encoding='utf-8')); s=d.get('statsguru', {}); assert s.get('lastAttemptStatus') in ('success', 'partial'), 'Statsguru refresh failed: '+repr(s.get('lastAttemptErrors', [])); formats=s.get('formats', {}); assert all(formats.get(f, {}).get('summary') and formats.get(f, {}).get('innings') for f in ('T20I','ODI','T20','IPL')), 'One or more core Statsguru/IPL formats are missing verified data'; print('Validated core Statsguru and IPL formats; optional FC/List A may remain partial; timestamp:', s.get('updatedAt'))"
            git add data/site-data.json
            if git diff --cached --quiet; then
              echo "No Statsguru data changes to commit."
              exit 0
            fi
            git commit -m "chore: refresh ESPNcricinfo Statsguru batting data"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update on attempt $attempt; retrying from latest main."
            sleep 2
          done
          echo "Unable to publish Statsguru data after 3 attempts."
          exit 1
