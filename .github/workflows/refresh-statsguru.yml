name: Refresh ESPNcricinfo Statsguru

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_statsguru.py"
      - ".github/workflows/refresh-statsguru.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tilak-shared-site-data
  cancel-in-progress: false

jobs:
  refresh-statsguru:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Statsguru refresh script
        run: python -m py_compile scripts/refresh_statsguru.py
      - name: Commit updated Statsguru snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/refresh_statsguru.py
            python -m json.tool data/site-data.json > /dev/null
            python -c "import json; from pathlib import Path; d=json.loads(Path('data/site-data.json').read_text(encoding='utf-8')); s=d.get('statsguru', {}); assert s.get('lastAttemptStatus') in ('success', 'partial'), 'Statsguru refresh failed: '+repr(s.get('lastAttemptErrors', [])); formats=s.get('formats', {}); assert all(formats.get(f, {}).get('summary') and formats.get(f, {}).get('innings') for f in ('T20I','ODI','T20')), 'One or more core Statsguru formats are missing verified data'; print('Validated core Statsguru formats; optional FC/List A may remain partial; timestamp:', s.get('updatedAt'))"
            git add data/site-data.json
            if git diff --cached --quiet; then
              echo "No Statsguru data changes to commit."
              exit 0
            fi
            git commit -m "chore: refresh ESPNcricinfo Statsguru batting data"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update on attempt $attempt; retrying from latest main."
            sleep 2
          done
          echo "Unable to publish Statsguru data after 3 attempts."
          exit 1
