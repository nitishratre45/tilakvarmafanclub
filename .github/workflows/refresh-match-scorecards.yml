name: Refresh Tilak Varma Match Scorecards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_match_scorecards.py"
      - ".github/workflows/refresh-match-scorecards.yml"

permissions:
  contents: write

concurrency:
  group: refresh-match-scorecards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate updater syntax
        run: python -m py_compile scripts/refresh_match_scorecards.py
      - name: Generate and publish scorecards without index conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot the last known-good archive. Restore it if any generation or validation step fails.
          backup_dir="$(mktemp -d)"
          cp -a matches/scorecards/. "$backup_dir"/
          restore_on_error() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::Scorecard refresh failed; restoring the previous verified archive."
              find matches/scorecards -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -a "$backup_dir"/. matches/scorecards/
            fi
            rm -rf "$backup_dir"
            exit "$status"
          }
          trap restore_on_error EXIT
          python -u scripts/refresh_match_scorecards.py
          python -m json.tool matches/scorecards/index.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("matches/scorecards/index.json").read_text(encoding="utf-8"))
          assert d.get("matchCount", 0) > 0, "Scorecard index is empty"
          assert len(d.get("matches", [])) == d["matchCount"], "Index count mismatch"
          print(f"Validated {d['matchCount']} scorecards.")
          PY
          # Keep generated output outside the checkout while syncing the latest main.
          rm -rf /tmp/generated-scorecards
          cp -a matches/scorecards /tmp/generated-scorecards
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p matches/scorecards
            cp -a /tmp/generated-scorecards/. matches/scorecards/
            git add matches/scorecards
            if git diff --cached --quiet; then
              echo "Scorecard data is already up to date."
              exit 0
            fi
            git commit -m "chore: refresh Tilak Varma match scorecards"
            if git push origin HEAD:main; then
              echo "Published scorecards successfully."
              exit 0
            fi
            echo "Concurrent push detected; retrying from latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "::error::Unable to publish scorecards after four attempts."
          exit 1
