name: Refresh ESPNcricinfo Bowling Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_bowling.py"
      - "scripts/refresh_statsguru.py"
      - ".github/workflows/refresh-bowling.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tilak-shared-site-data
  cancel-in-progress: false

jobs:
  refresh-bowling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bowling refresh script
        run: python -m py_compile scripts/refresh_statsguru.py scripts/refresh_bowling.py
      - name: Fetch and validate ESPNcricinfo bowling data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/refresh_bowling.py
            python -m json.tool data/site-data.json > /dev/null
            python -c "import json; from pathlib import Path; d=json.loads(Path('data/site-data.json').read_text(encoding='utf-8')); b=d.get('bowlingStats', {}); assert b.get('lastAttemptStatus') in ('success', 'partial'), 'Bowling refresh failed'; f=b.get('formats', {}); keys=('T20I','ODI','T20'); assert all(f.get(k, {}).get('summary') for k in keys); print('Bowling refresh status:', b.get('lastAttemptStatus')); print('Verified core bowling snapshots:', {k: (f[k]['summary'].get('matches'),f[k]['summary'].get('wickets'),len(f[k].get('innings',[]))) for k in keys}); print('Optional domestic formats:', {k: ('details available' if f.get(k, {}).get('careerBreakdown') or f.get(k, {}).get('innings') else 'summary only; detail rows unavailable') for k in ('List A','FC')}); print('Non-fatal detail limitations:', b.get('lastAttemptErrors', []))"
            git add data/site-data.json
            if git diff --cached --quiet; then
              echo "Bowling snapshot unchanged."
              exit 0
            fi
            git commit -m "chore: refresh ESPNcricinfo bowling data"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update on attempt $attempt; retrying from latest main."
            sleep 2
          done
          echo "Unable to publish bowling data after 3 attempts."
          exit 1
