name: Auto-rerun and diagnose failed GitHub Actions jobs

on:
  workflow_run:
    workflows:
      - "Browser smoke tests"
      - "Format source code"
      - "Refresh BCCI Live Matches"
      - "Refresh BCCI Match Results"
      - "Refresh BCCI Squads"
      - "Refresh BCCI Stats Fixtures"
      - "Refresh BCCI Videos"
      - "Refresh Bowling Stats"
      - "Refresh Death Overs"
      - "Refresh ICC Records"
      - "Refresh Match Scorecards"
      - "Refresh Statsguru"
      - "Refresh Tilak Data"
      - "Refresh Tilak News"
      - "Refresh Upcoming Matches"
      - "Validate Tilak Varma FC site"
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

# Recovery workflow must not listen to itself or other repair/monitor workflows.
concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose-and-retry:
    # Explicit allow-list blocks any recovery/monitor workflow from starting another recovery chain.
    if: >-
      github.event.workflow_run.name != 'Auto-rerun and diagnose failed GitHub Actions jobs' &&
      github.event.workflow_run.name != 'Repository health monitor (10 minutes)' &&
      github.event.workflow_run.name != 'Automation repository monitor (hourly)' &&
      github.event.workflow_run.name != 'Job recovery manager' &&
      github.event.workflow_run.name != 'Self-healing code guard' &&
      github.event.workflow_run.name != 'Matches Safe Auto-Repair' &&
      github.event.workflow_run.name != 'Matches Folder Audit (12h)' &&
      github.event.workflow_run.name != 'Admin diagnostics' &&
      github.event.workflow_run.name != 'Admin data editor tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose failures, track root-cause clues, and retry once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const issueTitle = `[Workflow Recovery] ${run.name}`;
            const runUrl = run.html_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;

            // Successful runs do not need a recovery action.
            if (run.conclusion === 'success') {
              core.notice(`Workflow completed successfully: ${run.name}`);
              return;
            }

            if (run.conclusion !== 'failure' && run.conclusion !== 'timed_out') {
              core.notice(`No action for conclusion: ${run.conclusion}`);
              return;
            }

            const attempt = Number(run.run_attempt || 1);
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const failedJobs = data.jobs.filter(job =>
              ['failure', 'timed_out'].includes(job.conclusion)
            );
            const details = failedJobs.map(job => {
              const failedSteps = (job.steps || [])
                .filter(step => ['failure', 'timed_out'].includes(step.conclusion))
                .map(step => `  - Step: ${step.name} — ${step.conclusion}`);
              return [
                `- Job: ${job.name} — ${job.conclusion}`,
                `  Job URL: ${job.html_url || runUrl}`,
                ...(failedSteps.length ? failedSteps : ['  - No failed step metadata available; inspect the job log.'])
              ].join('\n');
            });
            const body = [
              `## Workflow failure diagnosis: ${run.name}`,
              '',
              `- **Conclusion:** ${run.conclusion}`,
              `- **Attempt:** ${attempt}`,
              `- **Run:** ${runUrl}`,
              `- **Commit:** ${run.head_sha || 'unknown'}`,
              '',
              '### Failed jobs / steps',
              ...(details.length ? details : ['No failed job details were returned by the Actions API.']),
              '',
              '### Recovery policy',
              attempt < 2
                ? 'One automatic retry of failed jobs only may be requested. If it fails again, fix the underlying cause.'
                : 'Automatic retry limit reached. No further retry will be started.',
              '',
              'This report lists GitHub Actions metadata and does not assume a root cause without logs.'
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = openIssues.find(x => !x.pull_request && x.title === issueTitle);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: issueTitle, body
              });
            }

            if (attempt >= 2) {
              core.warning(`Retry limit reached for run ${run.id}; no further retry will occur.`);
              return;
            }

            if (!failedJobs.length) {
              core.warning('No failed/timed-out jobs eligible for retry. Diagnosis issue created.');
              return;
            }

            core.notice(`Requesting one retry for ${failedJobs.length} failed/timed-out job(s) in run ${run.id}.`);
            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              { owner, repo, run_id: run.id }
            );
            core.notice('GitHub accepted the failed-jobs-only retry request.');
