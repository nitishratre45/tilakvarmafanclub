name: Auto-rerun failed GitHub Actions jobs

on:
  workflow_run:
    workflows:
      - "Admin data editor tests"
      - "Admin Python diagnostics"
      - "Automation repository monitor (hourly)"
      - "Browser smoke tests"
      - "Format source code"
      - "Photo Section Guardian"
      - "Refresh BCCI Tilak Videos"
      - "Refresh ESPNcricinfo Bowling Stats"
      - "Refresh Tilak death-overs stats"
      - "Refresh ICC rankings and record highlights"
      - "Refresh ESPNcricinfo Statsguru"
      - "Refresh Tilak Varma data"
      - "Repository health monitor (10 minutes)"
      - "Self-healing code guard"
      - "Validate Tilak Varma FC site"
      - "Validate Admin Studio and Site Data"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed:
    name: Decide whether failed jobs need a retry
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retry failed jobs once, and report no-op runs as success
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Successful/cancelled/skipped upstream runs are normal no-op cases.
            // Keep this job successful instead of marking the whole workflow skipped.
            if (run.conclusion !== 'failure') {
              core.notice(`No retry needed: "${run.name}" concluded "${run.conclusion}".`);
              return;
            }

            const attempt = Number(run.run_attempt || 1);
            if (attempt >= 2) {
              core.notice(`Retry limit reached for "${run.name}" (run ${run.id}, attempt ${attempt}).`);
              return;
            }

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });
            const failedJobs = jobs.data.jobs.filter(job =>
              job.conclusion === 'failure' || job.conclusion === 'timed_out'
            );
            if (failedJobs.length === 0) {
              core.notice(`Workflow "${run.name}" failed, but no failed/timed-out jobs were found; nothing to retry.`);
              return;
            }

            core.notice(`Retrying ${failedJobs.length} failed/timed-out job(s) for "${run.name}" (run ${run.id}, attempt ${attempt}).`);
            // Use the REST route directly: github.rest.actions.reRunFailedJobs is
            // not available in this runner's Octokit version.
            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              { owner, repo, run_id: run.id }
            );
            core.notice(`GitHub accepted the failed-job retry request for run ${run.id}.`);
