name: Auto-rerun and diagnose failed GitHub Actions jobs

on:
  workflow_run:
    workflows:
      - "Browser smoke tests"
      - "Format source code"
      - "Refresh BCCI Tilak Videos"
      - "Refresh ESPNcricinfo Bowling Stats"
      - "Refresh Tilak death-overs stats"
      - "Refresh ESPNcricinfo Statsguru"
      - "Refresh Tilak Varma news"
      - "Refresh Tilak Varma Match Scorecards"
      - "Refresh Upcoming Matches from BCCI News JSON"
      - "Validate Tilak Varma FC site"
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose-and-retry:
    name: Diagnose failure and retry failed jobs once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose failures, track root-cause clues, and retry once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const issueTitle = `[Workflow Recovery] ${run.name}`;
            const runUrl = run.html_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;

            // A later successful run closes the recovery issue for that workflow.
            if (run.conclusion === 'success') {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100
              });
              const issue = openIssues.find(x => !x.pull_request && x.title === issueTitle);
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ Recovery check passed. Latest run: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed'
                });
              }
              core.notice(`Workflow completed successfully: ${run.name}`);
              return;
            }

            if (run.conclusion !== 'failure' && run.conclusion !== 'timed_out') {
              core.notice(`No action for conclusion: ${run.conclusion}`);
              return;
            }

            const attempt = Number(run.run_attempt || 1);
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const failedJobs = data.jobs.filter(job =>
              ['failure', 'timed_out', 'cancelled'].includes(job.conclusion)
            );
            const details = failedJobs.map(job => {
              const failedSteps = (job.steps || [])
                .filter(step => ['failure', 'timed_out', 'cancelled'].includes(step.conclusion))
                .map(step => `  - Step: ${step.name} — ${step.conclusion}`);
              return [
                `- Job: ${job.name} — ${job.conclusion}`,
                `  Job URL: ${job.html_url || runUrl}`,
                ...(failedSteps.length ? failedSteps : ['  - No failed step metadata available; inspect the job log.'])
              ].join('\n');
            });
            const body = [
              `## Workflow failure diagnosis: ${run.name}`,
              '',
              `- **Conclusion:** ${run.conclusion}`,
              `- **Attempt:** ${attempt}`,
              `- **Run:** ${runUrl}`,
              `- **Commit:** ${run.head_sha || 'unknown'}`,
              '',
              '### Failed jobs / steps',
              ...(details.length ? details : ['No failed job details were returned by the Actions API.']),
              '',
              '### Recovery policy',
              attempt < 2
                ? 'One automatic retry of failed jobs only will be requested. If it fails again, this issue remains open for a code-level fix.'
                : 'Automatic retry limit reached. No further retry will be started, to prevent loops. Inspect the linked failed step logs and fix the underlying cause.',
              '',
              'This report identifies failed jobs and steps from GitHub Actions metadata. It does not claim a root cause until the logs or checks confirm it.'
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = openIssues.find(x => !x.pull_request && x.title === issueTitle);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: issueTitle, body
              });
            }

            if (attempt >= 2) {
              core.warning(`Retry limit reached for run ${run.id}; issue updated and no further retry will occur.`);
              return;
            }

            const retryable = failedJobs.filter(job =>
              ['failure', 'timed_out'].includes(job.conclusion)
            );
            if (!retryable.length) {
              core.warning('No failed/timed-out jobs eligible for retry. Diagnosis issue created.');
              return;
            }

            core.notice(`Requesting one retry for ${retryable.length} failed/timed-out job(s) in run ${run.id}.`);
            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              { owner, repo, run_id: run.id }
            );
            core.notice('GitHub accepted the failed-jobs-only retry request.');
