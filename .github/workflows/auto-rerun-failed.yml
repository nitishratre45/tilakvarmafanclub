name: Auto-rerun and diagnose failed GitHub Actions jobs

on:
  workflow_run:
    workflows:
      - "Browser smoke tests"
      - "Format source code"
      - "Refresh BCCI Live Matches"
      - "Refresh BCCI Match Results"
      - "Refresh BCCI Squads"
      - "Refresh BCCI Stats Fixtures JSON"
      - "Refresh BCCI Tilak Videos"
      - "Refresh ESPNcricinfo Bowling Stats"
      - "Refresh Tilak death-overs stats"
      - "Refresh ICC rankings and record highlights"
      - "Refresh Tilak Varma Match Scorecards"
      - "Refresh ESPNcricinfo Statsguru"
      - "Refresh Tilak Varma data"
      - "Refresh Tilak Varma news"
      - "Refresh Upcoming Matches from BCCI News JSON"
      - "Validate Tilak Varma FC site"
      - "Matches Folder Audit (12h)"
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose-and-retry:
    # Never diagnose/retry the recovery workflow itself or repository monitors.
    if: >-
      contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.name != 'Auto-rerun and diagnose failed GitHub Actions jobs' &&
      github.event.workflow_run.name != 'Repository health monitor (10 minutes)' &&
      github.event.workflow_run.name != 'Automation repository monitor (hourly)' &&
      github.event.workflow_run.name != 'Job recovery manager' &&
      github.event.workflow_run.name != 'Self-healing code guard' &&
      github.event.workflow_run.name != 'Matches Safe Auto-Repair' &&
      github.event.workflow_run.name != 'Matches Folder Audit (12h)' &&
      github.event.workflow_run.name != 'Admin diagnostics' &&
      github.event.workflow_run.name != 'Admin data editor tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose failure and retry failed jobs at most once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const issueTitle = `[Workflow Recovery] ${run.name}`;
            const runUrl = run.html_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;

            if (run.conclusion === 'success') {
              core.notice(`Workflow passed: ${run.name}`);
              return;
            }
            if (!['failure', 'timed_out'].includes(run.conclusion)) {
              core.notice(`No recovery action for conclusion: ${run.conclusion}`);
              return;
            }

            const attempt = Number(run.run_attempt || 1);
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const failedJobs = data.jobs.filter(job => ['failure', 'timed_out'].includes(job.conclusion));
            const details = failedJobs.map(job => {
              const steps = (job.steps || [])
                .filter(step => ['failure', 'timed_out'].includes(step.conclusion))
                .map(step => `  - Step: ${step.name} — ${step.conclusion}`);
              return [`- Job: ${job.name} — ${job.conclusion}`,
                `  Job URL: ${job.html_url || runUrl}`,
                ...(steps.length ? steps : ['  - Check the linked job log for details.'])].join('\n');
            });
            const body = [
              `## Workflow failure: ${run.name}`, '',
              `- **Conclusion:** ${run.conclusion}`,
              `- **Attempt:** ${attempt}`,
              `- **Run:** ${runUrl}`,
              `- **Commit:** ${run.head_sha || 'unknown'}`, '',
              '### Failed jobs / steps',
              ...(details.length ? details : ['No failed job details were returned.']), '',
              attempt < 2
                ? 'One retry of failed jobs will be requested when supported.'
                : 'Retry limit reached; no further automatic retry will be attempted.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const issue = issues.find(item => !item.pull_request && item.title === issueTitle);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: issueTitle, body });
            }

            if (attempt >= 2 || !failedJobs.length) {
              core.warning('Retry skipped: retry limit reached or no retryable jobs found.');
              return;
            }

            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
              owner, repo, run_id: run.id
            });
            core.notice('Requested one retry of failed jobs.');
