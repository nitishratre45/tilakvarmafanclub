name: Auto-rerun failed GitHub Actions jobs

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed:
    name: Retry failed jobs once
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Auto-rerun failed GitHub Actions jobs' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only failed jobs
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.notice(`Workflow "${run.name}" failed (run ${run.id}, attempt ${run.run_attempt}). Retrying failed jobs once.`);
            try {
              await github.rest.actions.reRunFailedJobs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              core.notice(`Retry requested for failed jobs in run ${run.id}.`);
            } catch (error) {
              core.setFailed(`Could not re-run failed jobs for run ${run.id}: ${error.message}`);
            }
