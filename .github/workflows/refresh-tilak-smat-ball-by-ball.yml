name: Refresh Tilak Varma SMAT Ball-by-Ball Data

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: write

concurrency:
  group: tilak-smat-ball-by-ball
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Run supplied BCCI match-results collector
        run: python "SMAT/smat.py"
      - name: Run supplied BCCI scorecard downloader
        run: python "SMAT/smatscoreboard.py"
      - name: Collect Tilak-specific summary and enhanced commentary
        env:
          BCCI_EDAK: ${{ secrets.BCCI_EDAK }}
        run: python "SMAT/tilak_ball_by_ball.py"
      - name: Build consolidated Tilak SMAT data folder from verified source files
        run: python "tilakvarmasmatall/build_data.py"
      - name: Commit collected data and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "SMAT/data" "tilakvarmasmatall"
          if git diff --cached --quiet; then
            echo "No collected data changed."
          else
            git commit -m "Refresh Tilak Varma SMAT ball-by-ball data"
            git push
          fi
