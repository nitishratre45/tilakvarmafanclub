name: Format source code

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'death-overs/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*.md'
      - 'data/fan-zone.json'
      - 'data/tilak-news.json'
      - 'data/cricinfo-photos.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-source-code
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format HTML, CSS, JavaScript, JSON and Markdown
        run: |
          npx --yes prettier@3.6.2 --write index.html death-overs/index.html assets/*.js assets/*.css README.md DEPLOYMENT.md data/fan-zone.json data/tilak-news.json data/cricinfo-photos.json
      - name: Format Python scripts
        run: |
          python -m pip install --disable-pip-version-check black==25.1.0
          python -m black scripts
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Source files already follow the configured format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html death-overs/index.html assets scripts README.md DEPLOYMENT.md data/fan-zone.json data/tilak-news.json data/cricinfo-photos.json .editorconfig .prettierrc.json .prettierignore
          git commit -m "style: format site source files consistently"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update on attempt $attempt; retrying."
            git rebase --abort || true
            git reset --hard origin/main
            npx --yes prettier@3.6.2 --write index.html death-overs/index.html assets/*.js assets/*.css README.md DEPLOYMENT.md data/fan-zone.json data/tilak-news.json data/cricinfo-photos.json
            python -m black scripts
            git add index.html death-overs/index.html assets scripts README.md DEPLOYMENT.md data/fan-zone.json data/tilak-news.json data/cricinfo-photos.json .editorconfig .prettierrc.json .prettierignore
            git diff --cached --quiet && exit 0
            git commit -m "style: format site source files consistently"
          done
          echo "Could not publish formatting commit after retries."
          exit 1
