name: Fetch BCCI List A Session 2021
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bcci-list-a-session-2021
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Fetch BCCI competition results pages 1-20
        env:
          BCCI_COMP_GID: "16fd0877-f459-48ff-a92e-87756903ed20"
          BCCI_MIN_START_DATE: "2021-01-01"
          BCCI_FIRST_PAGE: "1"
          BCCI_LAST_PAGE: "20"
          BCCI_PAGE_SIZE: "12"
          BCCI_RESULTS_OUTPUT_DIR: "HYD/bcci_list_a_session_2021"
        run: python HYD/HYD.PY
      - name: Download scorecard JSON for every result GID
        env:
          BCCI_SCOREBOARD_INPUT_JSON: "HYD/bcci_list_a_session_2021/vijay_hazare_results.json"
        run: python HYD/hyd_scoreboard_builder.py
      - name: Extract Tilak batting, bowling and fielding and regenerate List A JSON
        run: python HYD/fetch_bcci_list_a_scorecard.py
      - name: Validate downloaded session and final List A JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          session = Path("HYD/bcci_list_a_session_2021")
          report = json.loads((session / "vijay_hazare_download_report.json").read_text())
          assert report.get("successful_pages") == 20, f"Expected 20 successful pages: {report}"
          assert not report.get("failed_pages"), f"Failed pages: {report.get('failed_pages')}"
          raw_dir = Path("HYD/hyd_scoreboards/json")
          scorecards = [p for p in raw_dir.glob("*.json") if p.name not in {"fetch_report.json", "errors.json"}]
          assert scorecards, "No downloaded scorecard JSONs"
          data = json.loads(Path("data/list-a.json").read_text())
          assert data.get("innings"), "List A batting innings missing"
          assert data.get("careerBreakdown"), "List A career breakdown missing"
          print(json.dumps({
              "pages_succeeded": report.get("successful_pages"),
              "records": report.get("unique_records"),
              "hyderabad_matches": report.get("hyderabad_matches"),
              "scorecard_json_files": len(scorecards),
              "batting_innings": len(data.get("innings", [])),
              "opposition_groups": [x.get("group") for x in data.get("careerBreakdown", []) if str(x.get("group", "")).startswith("v ")],
              "bowling_rows": len(data.get("bowlingInnings", [])),
              "fielding_rows": len(data.get("fieldingInnings", []))
          }, indent=2))
          PY
      - name: Commit session data and List A JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HYD/bcci_list_a_session_2021 HYD/hyd_scoreboards/json data/list-a.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Fetch BCCI List A session 2021 scorecards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
