name: Self-healing code guard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "home/**"
      - "stats/**"
      - "matches/**"
      - "photos/**"
      - "videos/**"
      - "news/**"
      - "records/**"
      - "News-details/**"
      - "functions/**"
      - "scripts/**"
      - "index.html"
      - "admin/index.html"
      - "death-overs/index.html"
      - ".github/workflows/self-healing.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

# Keep only one formatter/repair run active per branch. Newer commits supersede older scans.
concurrency:
  group: self-healing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-repair:
    name: Apply safe automatic repairs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply safe formatting repairs
        run: |
          find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -not -path './.git/*' -print0 | xargs -0 npx --yes prettier@3.6.2 --write
          python -m pip install --disable-pip-version-check black==25.1.0
          python -m black scripts

      - name: Run syntax and data-integrity checks
        id: checks
        continue-on-error: true
        run: |
          set -e
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n 1 node --check
          python -m compileall -q scripts
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"JSON OK: {path}")

          # Generated career/death-over snapshots are read-only here: validate, never rewrite.
          site = json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          if not isinstance(site, dict) or not site:
              raise SystemExit("data/site-data.json is empty or not an object")
          death = json.loads(Path("data/death-overs.json").read_text(encoding="utf-8"))
          if not isinstance(death, dict) or not death.get("updatedAt"):
              raise SystemExit("Death Overs snapshot is missing its timestamp")
          print("Core snapshots parsed successfully; generated data was not modified.")
          PY

      - name: Remove generated Python cache files
        if: always()
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -not -path './.git/*' -delete

      - name: Open a review PR for safe repairs
        id: create_pr
        # Never open/update a repair PR from a failed validation run. That created
        # PR checks that could not proceed and repeated bot PR activity.
        if: steps.checks.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/safe-auto-repair
          delete-branch: false
          add-paths: |
            **/*.html
            **/*.css
            **/*.js
            scripts/**/*.py
          base: main
          commit-message: "chore: apply safe automated source repairs"
          title: "🤖 Safe automated code repairs"
          body: |
            This PR contains only deterministic formatting repairs from Prettier/Black.
            Generated statistics and media JSON snapshots are validation-only and are never rewritten.

            The self-healing workflow also checks JavaScript syntax, Python compilation and JSON integrity.
            Please review the diff and let the normal CI checks pass before merging.

      - name: Report PR creation restriction
        if: steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Formatting and integrity checks ran, but GitHub did not allow this workflow to create a pull request."
          echo "Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests, or open a PR manually from bot/safe-auto-repair." >> "$GITHUB_STEP_SUMMARY"

      - name: Record validation failure
        if: steps.checks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Auto-diagnosis] Repository validation failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = [
              'The self-healing workflow found an error it cannot safely rewrite automatically.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'The workflow can format source files automatically, but it will not guess at logic changes or rewrite generated cricket datasets.',
              'Open the failed run and inspect the Run syntax and data-integrity checks step, fix the underlying issue, then rerun the workflow.',
            ].join(String.fromCharCode(10));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
