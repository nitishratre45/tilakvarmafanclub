name: Refresh Tilak Varma data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - 'scripts/refresh_career_stats.py'
      - '.github/workflows/refresh-tilak-data.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-tilak-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commit updated data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/refresh_data.py
            python scripts/refresh_career_stats.py
            python -m json.tool data/site-data.json > /dev/null
            python -c "import json; from pathlib import Path; site=json.loads(Path('data/site-data.json').read_text(encoding='utf-8')); assert isinstance(site, dict) and site, 'site-data.json is empty or invalid'; print('Validated profile/stats snapshot JSON.')"
            git add data/site-data.json
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "chore: refresh Tilak Varma profile and stats"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update on attempt $attempt; retrying from latest main."
            sleep 2
          done
          echo "Unable to publish refreshed data after 3 attempts."
          exit 1
