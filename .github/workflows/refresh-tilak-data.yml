name: Refresh Tilak Varma data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-tilak-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh recent innings from Cricsheet
        run: python scripts/refresh_data.py
      - name: Commit updated data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh Tilak Varma recent innings"
            git push
          fi
