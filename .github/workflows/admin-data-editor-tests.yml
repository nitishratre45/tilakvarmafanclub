name: Admin data editor tests

on:
  push:
    branches: [main]
    paths:
      - "functions/api/admin/data-editor.js"
      - "functions/api/admin/import-bcci-photo.js"
      - "functions/api/admin/content.js"
      - "functions/_lib/admin.js"
      - "data/site-data.json"
      - "data/death-overs.json"
      - "tests/admin-data-editor.test.mjs"
      - "tests/admin-monitor.test.mjs"
      - "tests/bcci-photo-import.test.mjs"
      - "tests/admin-media-content.test.mjs"
      - ".github/workflows/admin-data-editor-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-data-editor-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin-data-editor:
    # Safe auto-repair PRs already run deterministic syntax/data checks in self-healing.yml.
    # Skip redundant PR-triggered jobs for github-actions[bot] to avoid approval-gated action_required runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    name: Admin save validation and API safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Admin data editor endpoints against saved snapshots
        run: node --test tests/admin-data-editor.test.mjs
      - name: Test BCCI photo URL import and repository storage
        run: node --test tests/bcci-photo-import.test.mjs
      - name: Test Admin media preservation and URL-only duplicate behavior
        run: node --test tests/admin-media-content.test.mjs
      - name: Test Admin workflow monitor auth, timeout and rate-limit handling
        run: node --test tests/admin-monitor.test.mjs
      - name: Check Admin endpoint syntax
        run: |
          node --input-type=module --check < functions/api/admin/data-editor.js
          node --input-type=module --check < functions/api/admin/import-bcci-photo.js
          node --input-type=module --check < functions/api/admin/content.js
          node --input-type=module --check < functions/_lib/admin.js
