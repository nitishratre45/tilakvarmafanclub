name: Refresh BCCI Live Matches
on:
  workflow_dispatch:
  schedule:
    # Run every five minutes, offset from the busiest minute-zero boundary.
    # GitHub schedule uses UTC and may be delayed by GitHub queueing.
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_bcci_live_matches.py"
      - ".github/workflows/refresh-bcci-live-matches.yml"
permissions:
  contents: write
concurrency:
  group: refresh-bcci-live-matches
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate refresh script and existing JSON when present
        run: |
          set -euo pipefail
          python -m py_compile scripts/refresh_bcci_live_matches.py
          if [ -f bcci-fixtures-test/live-matches.json ]; then
            python -m json.tool bcci-fixtures-test/live-matches.json > /dev/null
          else
            echo "BCCI Fixtures live JSON does not exist yet; the refresh script must create it."
          fi
      - name: Fetch official BCCI live scores and save JSON
        run: python scripts/refresh_bcci_live_matches.py
      - name: Validate BCCI Fixtures live JSON
        run: |
          set -euo pipefail
          test -f bcci-fixtures-test/live-matches.json
          python -m json.tool bcci-fixtures-test/live-matches.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("bcci-fixtures-test/live-matches.json").read_text(encoding="utf-8"))
          assert data.get("status") == "updated-from-bcci-live-scores", "Unexpected live feed status"
          assert isinstance(data.get("matches"), list), "matches must be a JSON array"
          assert data.get("matchCount") == len(data["matches"]), "matchCount does not match matches length"
          print(f"Validated {len(data['matches'])} BCCI Fixtures live cards.")
          PY
      - name: Commit changed live JSON only
        run: |
          set -euo pipefail
          git add bcci-fixtures-test/live-matches.json
          if git diff --cached --quiet; then
            echo "Live JSON unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh BCCI live matches JSON"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish live match JSON after retries."
          exit 1
