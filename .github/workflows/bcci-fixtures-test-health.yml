name: BCCI Fixtures Test Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "bcci-fixtures-test/**"
      - ".github/workflows/bcci-fixtures-test-health.yml"

permissions:
  contents: read

concurrency:
  group: bcci-fixtures-test-health
  # Queue overlapping pushes instead of cancelling the active health check.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find bcci-fixtures-test -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking JS: $file"
            node --check "$file"
          done

      - name: Compile Python scripts
        run: python -m compileall -q bcci-fixtures-test

      - name: Validate BCCI JSON files
        shell: bash
        run: |
          set -euo pipefail
          find bcci-fixtures-test -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            echo "Checking JSON: $file"
            python -m json.tool "$file" >/dev/null
          done

      - name: Validate fixture data and source isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bcci-fixtures-test/bcci-fixtures.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(payload, dict), "fixture JSON root must be an object"
          assert payload.get("status") == "ok", f"fixture snapshot status is {payload.get('status')!r}"
          data = payload.get("data") or {}
          matches = data.get("match") or data.get("matches") or data.get("fixtures")
          assert isinstance(matches, list), "fixture JSON must contain a match list"
          assert matches, "fixture JSON match list is empty"
          keys = []
          missing_identity = []
          for i, match in enumerate(matches):
              if not isinstance(match, dict):
                  raise AssertionError(f"match[{i}] is not an object")
              key = str(match.get("gid") or match.get("match_gid") or match.get("match_id") or match.get("id") or "")
              if not key:
                  missing_identity.append(i)
              else:
                  keys.append(key)
              if not (match.get("name") or match.get("title") or match.get("match_short_name")):
                  raise AssertionError(f"match[{i}] has no display name")
          if missing_identity:
              raise AssertionError(f"matches missing IDs at indexes: {missing_identity}")
          if len(keys) != len(set(keys)):
              duplicates = sorted({key for key in keys if keys.count(key) > 1})
              raise AssertionError(f"duplicate fixture IDs: {duplicates}")
          print(f"Validated {len(matches)} fixtures: status=ok, IDs unique, display names present.")
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          js = Path("bcci-fixtures-test/app.js").read_text(encoding="utf-8")
          start = js.find("  async function load() {")
          end = js.find('\n  if ($("refreshBtn"))', start)
          assert start >= 0 and end > start, "fixture loader boundaries not found"
          fixture_loader = js[start:end]
          assert re.search(r'fetch\(["\']\./bcci-fixtures\.json\?t=', fixture_loader), \
              "fixture loader must fetch ./bcci-fixtures.json"
          for unwanted in ("upcoming-fixtures-refresh.json", "bcci-stats-fixtures.json"):
              assert unwanted not in fixture_loader, f"fixture loader unexpectedly references {unwanted}"
          live_start = js.find("  async function checkLiveMode()")
          assert live_start >= 0, "dedicated live-grid checkLiveMode() missing"
          live_code = js[live_start:]
          # The team-name filter is declared outside checkLiveMode(), so inspect the whole JS file.
          assert r"\\b(india a|a team|emerging|under ?19|u19|youth|junior)\\b" not in js, \
              "live-team exclusion regex is over-escaped; A/youth teams could leak into the India live grid"
          assert r"\b(india a|a team|emerging|under ?19|u19|youth|junior)\b" in js, \
              "live-team exclusion regex must use word boundaries"
          assert "live-matches.json" in live_code, "dedicated live JSON source missing"
          assert "setInterval(checkLiveMode,60000)" in live_code.replace(" ", ""), \
              "60-second live polling missing"
          print("Verified fixture grid uses only bcci-fixtures.json; dedicated live JSON polling remains present.")
          PY

      - name: Validate Cricsheet Recent Match archive setup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          root = Path("bcci-fixtures-test/recent-match")
          required = [
              root / "index.html",
              root / "recent-match.css",
              root / "recent-match.js",
              root / "build_cricsheet_archive.py",
              root / "recent-scorecard" / "index.html",
              root / "recent-scorecard" / "scorecard.css",
              root / "recent-scorecard" / "scorecard.js",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, f"Recent Match files missing: {missing}"
          builder = root / "build_cricsheet_archive.py"
          ast.parse(builder.read_text(encoding="utf-8"), filename=str(builder))
          source = builder.read_text(encoding="utf-8")
          for archive in ("t20s_male_json.zip", "odis_male_json.zip", "tests_male_json.zip"):
              assert archive in source, f"Cricsheet archive source missing: {archive}"
          assert "archive-index.json" in source and "TemporaryDirectory" in source
          js = (root / "recent-match.js").read_text(encoding="utf-8")
          scorecard = (root / "recent-scorecard" / "scorecard.js").read_text(encoding="utf-8")
          assert ".slice(0,5)" in js.replace(" ", ""), "Recent Match must cap results at five"
          assert "recent-scorecard" in js, "Recent Match scorecard link missing"
          for field in ("batting", "bowling", "fallOfWickets", "extrasBreakdown"):
              assert field in scorecard, f"Scorecard renderer missing {field}"
          workflow = Path(".github/workflows/refresh-bcci-test-recent-match.yml").read_text(encoding="utf-8")
          assert 'cron: "37 2 * * *"' in workflow, "Daily refresh schedule changed unexpectedly"
          assert "archive-index.json" in workflow and "git push origin HEAD:main" in workflow
          print("PASS: Recent Match assets, T20I/ODI/Test sources, last-five filter, scorecard renderer and daily archive workflow.")
          PY

      - name: Verify page asset references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(".").resolve()
          pages = sorted(Path("bcci-fixtures-test").rglob("*.html"))
          failures = []
          for page in pages:
              source = page.read_text(encoding="utf-8")
              for ref in re.findall(r'''(?:src|href)=["']([^"']+)["']''', source):
                  url = urlsplit(ref)
                  if url.scheme or url.netloc or ref.startswith("#") or not url.path:
                      continue
                  target = (root / url.path.lstrip("/")) if url.path.startswith("/") else (page.parent / url.path)
                  if not target.exists():
                      failures.append(f"{page}: missing asset {ref}")
              ids = re.findall(r'''\bid=["']([^"']+)["']''', source)
              duplicates = sorted({value for value in ids if ids.count(value) > 1})
              if duplicates:
                  failures.append(f"{page}: duplicate IDs {duplicates}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Validated local asset references and duplicate IDs in {len(pages)} BCCI HTML pages.")
          PY

      - name: Verify integrated Matches navigation and view separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="main-nav"' bcci-fixtures-test/ui/site-nav.js
          grep -q '/assets/mobile-glass-menu.js' bcci-fixtures-test/index.html
          grep -q '/assets/mobile-bottom-nav.js' bcci-fixtures-test/index.html
          grep -q 'Upcoming Match' bcci-fixtures-test/index.html
          grep -q 'Complete Match' bcci-fixtures-test/index.html
          test -f bcci-fixtures-test/complete/index.html
          test -f bcci-fixtures-test/complete/complete.js
          ! grep -Eqi 'Live Scores|href=["'\''"]/results/|Results tab' bcci-fixtures-test/index.html
          ! grep -Eqi 'Live Scores|Results tab' bcci-fixtures-test/complete/index.html
          echo "Matches navigation, upcoming/completed views, and removal of obsolete Live/Results tabs verified."

      - name: Test Match Centre exclusive section tabs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("bcci-fixtures-test")
          page = (root / "bcci-scorecard-page.html").read_text(encoding="utf-8")
          js = (root / "bcci-scorecard-page.js").read_text(encoding="utf-8")
          css = (root / "bcci-scorecard-page.css").read_text(encoding="utf-8")
          fetcher = (root / "fetch_bcci_fixtures.py").read_text(encoding="utf-8")
          names = ("live-score", "scorecard", "squads", "match-details")
          for name in names:
              assert f'data-match-section="{name}"' in page, f"missing {name} tab"
              assert f'data-match-panel="{name}"' in page, f"missing {name} panel"
              assert f'aria-controls="panel-{name}"' in page, f"missing aria-controls for {name}"
          assert page.count('class="match-section-panel is-active"') == 1, "exactly one panel must be active on first render"
          assert page.count('class="match-section-panel"') == 3, "the other three panels must start inactive"
          for panel_id in ("panel-live-score", "panel-scorecard", "panel-squads", "panel-match-details"):
              assert f'id="{panel_id}"' in page, f"missing panel ID {panel_id}"
          assert 'function activateMatchSection(name' in js, "section switching function missing"
          assert 'item.hidden = !active' in js, "inactive panels are not hidden"
          assert 'aria-selected' in js and 'ArrowRight' in js and 'ArrowLeft' in js, "tab keyboard accessibility missing"
          assert '.match-section-panel[hidden]' in css, "hidden panel CSS guard missing"
          assert './results/results.json' not in js, "stale removed results folder is still referenced"
          assert 'save_completed_results' not in fetcher, "fixture fetcher still creates the removed results archive"
          assert 'bcci-fixtures-test/results' not in fetcher, "fixture fetcher still writes into removed results folder"
          for obsolete in ("match-centre-modal.js", "match-centre-modal.css"):
              assert not (root / obsolete).exists(), f"unused legacy modal asset remains: {obsolete}"
          print("PASS: four exclusive Match Centre tabs; keyboard navigation; no stale results archive; unused modal assets removed.")
          PY

      - name: Check deployed BCCI pages and exclusive tabs
        shell: bash
        run: |
          set -euo pipefail
          url="https://tilakvarmafc.pages.dev/bcci-fixtures-test/"
          code="$(curl -L -sS --max-time 25 -o /tmp/bcci-page.html -w '%{http_code}' "$url")"
          echo "Deployed fixtures page HTTP status: $code"
          test "$code" = "200"
          grep -qi 'BCCI' /tmp/bcci-page.html
          score_url="https://tilakvarmafc.pages.dev/bcci-fixtures-test/bcci-scorecard-page.html?v=$GITHUB_SHA"
          deployed=0
          for attempt in 1 2 3 4 5 6; do
            score_code="$(curl -L -sS --max-time 25 -o /tmp/bcci-scorecard-page.html -w '%{http_code}' "$score_url" || true)"
            if [ "$score_code" = "200" ] && grep -Fq 'data-match-section="live-score"' /tmp/bcci-scorecard-page.html && grep -Fq 'data-match-panel="live-score"' /tmp/bcci-scorecard-page.html; then
              deployed=1
              break
            fi
            echo "Waiting for deployed Match Centre tabs (attempt $attempt/6, HTTP $score_code)."
            sleep 10
          done
          test "$deployed" = "1"
          for section in live-score scorecard squads match-details; do
            grep -Fq "data-match-section=\"$section\"" /tmp/bcci-scorecard-page.html
          done
          echo "PASS: deployed BCCI page is HTTP 200 and Match Centre contains all four exclusive sections."
