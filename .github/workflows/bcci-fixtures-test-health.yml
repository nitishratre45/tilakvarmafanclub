name: BCCI Fixtures Test Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "bcci-fixtures-test/**"
      - ".github/workflows/bcci-fixtures-test-health.yml"

permissions:
  contents: read

concurrency:
  group: bcci-fixtures-test-health
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find bcci-fixtures-test -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking JS: $file"
            node --check "$file"
          done

      - name: Compile Python scripts
        run: python -m compileall -q bcci-fixtures-test

      - name: Validate BCCI JSON files
        shell: bash
        run: |
          set -euo pipefail
          find bcci-fixtures-test -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            echo "Checking JSON: $file"
            python -m json.tool "$file" >/dev/null
          done

      - name: Validate fixture data and source isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bcci-fixtures-test/bcci-fixtures.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(payload, dict), "fixture JSON root must be an object"
          assert payload.get("status") == "ok", f"fixture snapshot status is {payload.get('status')!r}"
          data = payload.get("data") or {}
          matches = data.get("match") or data.get("matches") or data.get("fixtures")
          assert isinstance(matches, list), "fixture JSON must contain a match list"
          assert matches, "fixture JSON match list is empty"
          keys = []
          missing_identity = []
          for i, match in enumerate(matches):
              if not isinstance(match, dict):
                  raise AssertionError(f"match[{i}] is not an object")
              key = str(match.get("gid") or match.get("match_gid") or match.get("match_id") or match.get("id") or "")
              if not key:
                  missing_identity.append(i)
              else:
                  keys.append(key)
              if not (match.get("name") or match.get("title") or match.get("match_short_name")):
                  raise AssertionError(f"match[{i}] has no display name")
          if missing_identity:
              raise AssertionError(f"matches missing IDs at indexes: {missing_identity}")
          if len(keys) != len(set(keys)):
              duplicates = sorted({key for key in keys if keys.count(key) > 1})
              raise AssertionError(f"duplicate fixture IDs: {duplicates}")
          print(f"Validated {len(matches)} fixtures: status=ok, IDs unique, display names present.")
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          js = Path("bcci-fixtures-test/app.js").read_text(encoding="utf-8")
          start = js.find("  async function load() {")
          end = js.find('\n  if ($("refreshBtn"))', start)
          assert start >= 0 and end > start, "fixture loader boundaries not found"
          fixture_loader = js[start:end]
          assert re.search(r'fetch\(["\']\./bcci-fixtures\.json\?t=', fixture_loader), \
              "fixture loader must fetch ./bcci-fixtures.json"
          for unwanted in ("upcoming-fixtures-refresh.json", "bcci-stats-fixtures.json"):
              assert unwanted not in fixture_loader, f"fixture loader unexpectedly references {unwanted}"
          live_start = js.find("  async function checkLiveMode()")
          assert live_start >= 0, "dedicated live-grid checkLiveMode() missing"
          live_code = js[live_start:]
          assert r"\\b(india a|a team|emerging|under ?19|u19|youth|junior)\\b" not in live_code, \
              "live-team exclusion regex is over-escaped; A/youth teams could leak into the India live grid"
          assert r"\b(india a|a team|emerging|under ?19|u19|youth|junior)\b" in live_code, \
              "live-team exclusion regex must use word boundaries"
          assert "live-matches.json" in live_code, "dedicated live JSON source missing"
          assert "setInterval(checkLiveMode,60000)" in live_code.replace(" ", ""), \
              "60-second live polling missing"
          print("Verified fixture grid uses only bcci-fixtures.json; dedicated live JSON polling remains present.")
          PY

      - name: Verify page asset references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(".").resolve()
          pages = sorted(Path("bcci-fixtures-test").rglob("*.html"))
          failures = []
          for page in pages:
              source = page.read_text(encoding="utf-8")
              for ref in re.findall(r'''(?:src|href)=["']([^"']+)["']''', source):
                  url = urlsplit(ref)
                  if url.scheme or url.netloc or ref.startswith("#") or not url.path:
                      continue
                  target = (root / url.path.lstrip("/")) if url.path.startswith("/") else (page.parent / url.path)
                  if not target.exists():
                      failures.append(f"{page}: missing asset {ref}")
              ids = re.findall(r'''\bid=["']([^"']+)["']''', source)
              duplicates = sorted({value for value in ids if ids.count(value) > 1})
              if duplicates:
                  failures.append(f"{page}: duplicate IDs {duplicates}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Validated local asset references and duplicate IDs in {len(pages)} BCCI HTML pages.")
          PY

      - name: Verify integrated Matches navigation and view separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="main-nav"' bcci-fixtures-test/ui/site-nav.js
          grep -q '/assets/mobile-glass-menu.js' bcci-fixtures-test/index.html
          grep -q '/assets/mobile-bottom-nav.js' bcci-fixtures-test/index.html
          grep -q 'Upcoming Match' bcci-fixtures-test/index.html
          grep -q 'Complete Match' bcci-fixtures-test/index.html
          test -f bcci-fixtures-test/complete/index.html
          test -f bcci-fixtures-test/complete/complete.js
          ! grep -Eqi 'Live Scores|href=["'\''"]/results/|Results tab' bcci-fixtures-test/index.html
          ! grep -Eqi 'Live Scores|Results tab' bcci-fixtures-test/complete/index.html
          echo "Matches navigation, upcoming/completed views, and removal of obsolete Live/Results tabs verified."

      - name: Check deployed BCCI page
        shell: bash
        run: |
          set -euo pipefail
          url="https://tilakvarmafc.pages.dev/bcci-fixtures-test/"
          code="$(curl -L -sS --max-time 25 -o /tmp/bcci-page.html -w '%{http_code}' "$url")"
          echo "Deployed page HTTP status: $code"
          test "$code" = "200"
          grep -qi 'BCCI' /tmp/bcci-page.html
          echo "Deployed BCCI test page returned HTTP 200 and contains BCCI branding."
