name: Refresh Custom BCCI Fixtures JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-custom-bcci-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and save supplied BCCI fixtures URL
        run: python scripts/refresh_bcci_custom_fixtures.py

      - name: Commit JSON snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bcci-fixtures-test/bcci-custom-fixtures.json

          if git diff --cached --quiet; then
            echo "No changes in BCCI custom fixtures JSON."
            exit 0
          fi

          git commit -m "data: refresh custom BCCI fixtures JSON"

          # Integrate concurrent main-branch updates before pushing. Never force-push.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase conflict while updating main. No remote changes were overwritten."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Custom BCCI fixtures JSON pushed successfully."
              exit 0
            fi

            echo "Push rejected; will fetch and rebase again."
            sleep "$((attempt * 2))"
          done

          echo "::error::Push failed after 5 attempts because main kept changing."
          exit 1
