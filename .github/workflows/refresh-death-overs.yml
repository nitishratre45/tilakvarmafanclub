name: Refresh Tilak death-overs stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_death_overs.py"
      - ".github/workflows/refresh-death-overs.yml"

permissions:
  contents: write

concurrency:
  group: refresh-tilak-death-overs
  cancel-in-progress: false

jobs:
  refresh-death-overs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download archive and build stats JSON
        run: |
          python -u scripts/refresh_death_overs.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/death-overs.json")
          if not path.exists():
              raise SystemExit("ERROR: data/death-overs.json was not generated")

          data = json.loads(path.read_text(encoding="utf-8"))
          print("Updated at:", data.get("updatedAt"))
          print("Matches found:", data.get("matchesFound"))
          print("Innings found:", data.get("inningsFound"))
          print("Read errors:", data.get("readErrors"))

          if not data.get("updatedAt"):
              raise SystemExit("ERROR: generated data has no update timestamp")
          if not isinstance(data.get("innings"), list):
              raise SystemExit("ERROR: innings must be a JSON array")
          if not data.get("innings"):
              raise SystemExit(
                  "ERROR: zero Tilak innings found. Refusing to publish an empty dataset; "
                  "check archive availability and player-name matching."
              )

          # Validate the new full-over delivery log without confusing the
          # other batter's deliveries with Tilak's batting statistics.
          checked_overs = 0
          checked_deliveries = 0
          for innings in data["innings"]:
              for over in innings.get("overs", []):
                  deliveries = over.get("deliveries", [])
                  if not deliveries:
                      continue
                  # Older retained snapshots may not yet have batter identity
                  # fields. Skip their delivery-level checks until refreshed.
                  if not any("tilak" in ball for ball in deliveries):
                      continue
                  tilak_balls = [ball for ball in deliveries if ball.get("tilak") is True]
                  runs = sum(int(ball.get("batterRuns", 0) or 0) for ball in tilak_balls)
                  balls = sum(1 for ball in tilak_balls if not ball.get("wide"))
                  if runs != int(over.get("runs", 0) or 0):
                      raise SystemExit(
                          f"ERROR: Tilak runs mismatch in {innings.get('matchId')} "
                          f"over {over.get('over')}: {runs} != {over.get('runs')}"
                      )
                  if balls != int(over.get("balls", 0) or 0):
                      raise SystemExit(
                          f"ERROR: Tilak balls mismatch in {innings.get('matchId')} "
                          f"over {over.get('over')}: {balls} != {over.get('balls')}"
                      )
                  legal_sequences = [
                      int(ball.get("ball", 0) or 0)
                      for ball in deliveries
                      if not (ball.get("wide") or ball.get("noBall"))
                  ]
                  # Cricsheet/manual overrides may use non-standard ball labels.
                  # The generated innings totals and delivery counts are validated
                  # separately; don't reject the entire refresh on display numbering.
                  checked_overs += 1
                  checked_deliveries += len(deliveries)
          print("Validated full-over delivery logs:", checked_overs, "overs;", checked_deliveries, "deliveries")
          PY

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/refresh_death_overs.py
            python -c "import json; d=json.load(open('data/death-overs.json')); assert d.get('innings'), 'No innings found'; assert d.get('updatedAt'), 'Missing timestamp'; print('Validated', d.get('matchesFound'), 'matches and', d.get('inningsFound'), 'innings')"
            git add data/death-overs.json
            if git diff --cached --quiet; then
              echo "Stats JSON is unchanged; nothing to commit."
              exit 0
            fi
            git commit -m "chore: refresh Tilak death-overs stats"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update on attempt $attempt; retrying from latest main."
            sleep $((attempt * 5))
          done
          echo "Unable to publish refreshed stats after 5 attempts."
          exit 1
