name: Refresh BCCI Squads
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */12 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_bcci_squads.py"
      - ".github/workflows/refresh-bcci-squads.yml"
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh-bcci-squads
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/refresh_bcci_squads.py
      - name: Fetch India and West Indies squads
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_bcci_squads.py
      - name: Validate squads snapshot
        run: |
          if [ ! -f matches/bcci-squads.json ]; then
            echo "::error::Squad refresh did not create matches/bcci-squads.json; refusing to mark this run successful."
            exit 1
          fi
          python -m json.tool matches/bcci-squads.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("matches/bcci-squads.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("squads"), list), "Squads snapshot must contain a squads array"
          # New Zealand is maintained from its official NZC announcement, not the
          # India/West Indies EllipseData endpoint. Never let that refresh drop it.
          assert any(
              str(x.get("teamId")) == "5"
              and str(x.get("classId")) == "3"
              and x.get("players")
              and str(x.get("source", "")).startswith("https://www.nzc.nz/")
              for x in data["squads"]
          ), "Official New Zealand T20I squad snapshot was lost"
          if data.get("status") != "updated-from-bcci-squads":
              # A legacy/previously saved snapshot may be retained while the
              # provider is unavailable; do not reject it just for its status.
              print("Retained existing snapshot status:", data.get("status", "unknown"))
          else:
              assert any(x.get("teamId") == "6" and x.get("players") for x in data["squads"])
              assert any(x.get("teamId") == "4" and x.get("players") for x in data["squads"])
          print(f"Validated {len(data['squads'])} squad lists.")
          PY
      - name: Track upstream provider outage while retaining the verified snapshot
        if: steps.refresh.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '[Squad Refresh] Upstream provider unavailable';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const fs = require('fs');
            let snapshot = {};
            try {
              snapshot = JSON.parse(fs.readFileSync('matches/bcci-squads.json', 'utf8'));
            } catch {}
            const body = [
              'The scheduled squad refresh could not retrieve the India/West Indies squads from the upstream provider.',
              '',
              '- **Action:** The last saved snapshot was retained; no partial provider response was published.',
              `- **Saved snapshot status:** ${snapshot.status || 'unknown'}`,
              `- **Saved snapshot timestamp:** ${snapshot.checkedAt || 'unknown'}`,
              `- **Workflow run:** ${runUrl}`,
              '',
              'Inspect the failed “Fetch India and West Indies squads” step. This alert closes automatically after a successful refresh.'
            ].join('\\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
            core.warning('Provider refresh failed. Existing verified squads were preserved and a tracking issue was opened/updated.');

      - name: Close provider outage issue after successful refresh
        if: steps.refresh.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '[Squad Refresh] Upstream provider unavailable';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed'
              });
              core.notice('Closed the squad provider outage issue after a successful refresh.');
            }

      - name: Commit snapshot if changed
        run: |
          if [ ! -f matches/bcci-squads.json ]; then
            echo "::error::No verified squad snapshot exists to publish."
            exit 1
          fi
          git add matches/bcci-squads.json
          if git diff --cached --quiet; then echo "No squad changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh BCCI squads snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
