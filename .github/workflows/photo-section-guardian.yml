name: Photo Section Guardian

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/admin-media.json"
      - "photos/gallery.js"
      - "photos/gallery.css"
      - "photos/photos.css"
      - "tests/photos-page-assets.test.mjs"
      - "photos/index.html"
      - "index.html"
      - "scripts/photo-section-guardian.mjs"
      - "tests/photo-section-guardian.test.mjs"
      - "scripts/photo-link-health.mjs"
      - "tests/photo-link-health.test.mjs"
      - ".github/workflows/photo-section-guardian.yml"

permissions:
  contents: write

concurrency:
  group: photo-section-guardian-main
  cancel-in-progress: false

jobs:
  audit-and-repair:
    name: Audit and safely repair photo library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Photos page asset cleanup
        run: node --test tests/photos-page-assets.test.mjs
      - name: Test guardian safety rules
        run: node --test tests/photo-section-guardian.test.mjs
      - name: Test external photo URL health reporting
        run: node --test tests/photo-link-health.test.mjs
      - name: Validate gallery and audit media
        run: |
          test -f index.html
          test -f photos/index.html
          test -f photos/gallery.js
          test -f photos/gallery.css
          test -f photos/photos.css
          node --check photos/gallery.js
          node --check scripts/photo-section-guardian.mjs
          node --check scripts/photo-link-health.mjs
          node scripts/photo-section-guardian.mjs
          # Network failures while contacting external image hosts are reported but never alter metadata.
          node scripts/photo-link-health.mjs
      - name: Commit safe URL-only repairs
        run: |
          if ! git diff --quiet -- data/admin-media.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/admin-media.json
            git commit -m "chore: repair exact duplicate photo URLs"
            git push
          else
            echo "No safe photo metadata repairs needed."
          fi

      - name: Upload photo health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-health-report
          path: photo-health-report.json
          if-no-files-found: warn
          retention-days: 14
