name: Refresh BCCI Fixtures JSON - BCCI Folder Only

on:
  workflow_dispatch:
  push:
    paths:
      - 'bcci-fixtures-test/fetch_bcci_fixtures.py'
      - '.github/workflows/fetch-bcci-fixtures-json.yml'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bcci-fixtures-only
  cancel-in-progress: false

jobs:
  refresh-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch fixtures JSON
        id: fixtures
        run: python bcci-fixtures-test/fetch_bcci_fixtures.py

      - name: Validate fixtures JSON and fetch status
        run: |
          python -m json.tool bcci-fixtures-test/bcci-fixtures.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('bcci-fixtures-test/bcci-fixtures.json').read_text(encoding='utf-8'))
          if data.get('status') != 'ok':
              raise SystemExit('BCCI fixtures fetch did not succeed: ' + str(data.get('error')))
          root = data.get('data')
          if not isinstance(root, dict):
              raise SystemExit('BCCI fixtures response has no data object')
          matches = root.get('match') or root.get('matches') or root.get('fixtures')
          if not isinstance(matches, list) or not matches:
              raise SystemExit('BCCI fixtures response has no non-empty match list; refusing to publish')
          ids = []
          for index, match in enumerate(matches):
              if not isinstance(match, dict):
                  raise SystemExit(f'Fixture {index} is not an object; refusing to publish')
              match_id = str(match.get('gid') or match.get('match_gid') or match.get('match_id') or match.get('id') or '').strip()
              if not match_id:
                  raise SystemExit(f'Fixture {index} has no stable ID; refusing to publish')
              if not str(match.get('name') or match.get('title') or match.get('match_short_name') or '').strip():
                  raise SystemExit(f'Fixture {match_id} has no display name; refusing to publish')
              ids.append(match_id)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate fixture IDs detected; refusing to publish')
          print(f'Validated {len(matches)} BCCI fixtures: IDs unique and display names present.')
          PY
      - name: Commit fixtures JSON only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bcci-fixtures-test/bcci-fixtures.json
          if git diff --cached --quiet; then echo "Fixtures unchanged."; exit 0; fi
          git commit -m "Refresh BCCI fixtures JSON"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish fixtures JSON."
          exit 1
