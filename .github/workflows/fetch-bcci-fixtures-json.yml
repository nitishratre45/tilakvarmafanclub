name: Refresh BCCI Fixtures JSON - BCCI Folder Only

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bcci-fixtures-only
  cancel-in-progress: false

jobs:
  refresh-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch fixtures JSON
        id: fixtures
        continue-on-error: true
        run: python bcci-fixtures-test/fetch_bcci_fixtures.py

      - name: Validate fixtures JSON
        run: python -m json.tool bcci-fixtures-test/bcci-fixtures.json > /dev/null
      - name: Commit fixtures JSON only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bcci-fixtures-test/bcci-fixtures.json
          if git diff --cached --quiet; then echo "Fixtures unchanged."; exit 0; fi
          git commit -m "Refresh BCCI fixtures JSON"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish fixtures JSON."
          exit 1
