name: Refresh BCCI Fixtures and Live Scores JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bcci-test-json-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch fixtures JSON (fixtures endpoint only)
        run: python bcci-fixtures-test/fetch_bcci_fixtures.py
      - name: Fetch live scores JSON (live_scores endpoint only)
        run: python bcci-fixtures-test/fetch_bcci_live_scores.py
      - name: Upload separate JSON files
        uses: actions/upload-artifact@v4
        with:
          name: bcci-fixtures-and-live-scores
          path: |
            bcci-fixtures-test/bcci-fixtures.json
            bcci-fixtures-test/bcci-live-scores.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit updated test JSON files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bcci-fixtures-test/bcci-fixtures.json bcci-fixtures-test/bcci-live-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh isolated BCCI fixtures and live scores JSON"
            # Other workflows may update main after checkout. Rebase our
            # JSON-only commit onto the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Could not rebase refresh commit onto latest main."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Refresh JSON commit pushed successfully."
                exit 0
              fi
              echo "Push rejected (attempt $attempt); retrying with latest main."
              sleep 2
            done
            echo "::error::Could not push refresh JSON commit after 3 attempts."
            exit 1
          else
            echo "Both BCCI test JSON files are unchanged."
          fi
