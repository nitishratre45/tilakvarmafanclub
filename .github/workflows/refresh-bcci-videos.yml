name: Refresh BCCI Tilak Videos

on:
  push:
    paths:
      - 'scripts/refresh_bcci_videos.py'
      - '.github/workflows/refresh-bcci-videos.yml'
  schedule:
    # 00:00 India Standard Time (18:30 UTC on the previous day)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bcci-tilak-videos
  cancel-in-progress: false

jobs:
  refresh-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh official BCCI video metadata and playback URLs
        run: python scripts/refresh_bcci_videos.py
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- assets/bcci-videos.json; then
            echo "No changes to the BCCI video feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp assets/bcci-videos.json /tmp/bcci-videos.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bcci-videos.json assets/bcci-videos.json
          git add assets/bcci-videos.json
          git commit -m "Refresh official BCCI Tilak video feed"
          git push
