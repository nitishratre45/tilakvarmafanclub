name: Refresh BCCI Tilak Videos

on:
  push:
    paths:
      - 'scripts/refresh_bcci_videos.py'
      - '.github/workflows/refresh-bcci-videos.yml'
  schedule:
    # 00:00 India Standard Time (18:30 UTC on the previous day)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bcci-tilak-videos
  cancel-in-progress: false

jobs:
  refresh-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Refresh official BCCI video metadata and playback URLs
        run: python scripts/refresh_bcci_videos.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          cp assets/bcci-videos.json "$snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" assets/bcci-videos.json
            python -m json.tool assets/bcci-videos.json > /dev/null
            if git diff --quiet -- assets/bcci-videos.json; then
              echo "No changes to the BCCI video feed."
              exit 0
            fi
            git add assets/bcci-videos.json
            git commit -m "Refresh official BCCI Tilak video feed"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update on attempt $attempt; retrying."
            sleep 2
          done
          echo "Unable to publish BCCI video feed after 3 attempts."
          exit 1
