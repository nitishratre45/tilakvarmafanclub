name: Refresh BCCI Tilak Videos

on:
  push:
    paths:
      - 'scripts/refresh_bcci_videos.py'
      - '.github/workflows/refresh-bcci-videos.yml'
      - 'data/video-config.json'
  schedule:
    # Refresh the BCCI Tilak video catalogue and signed playback URLs every 12 hours (06:00 and 18:00 IST).
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bcci-tilak-videos-v2
  cancel-in-progress: false

jobs:
  refresh-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Refresh official BCCI video metadata and playback URLs
        run: python scripts/refresh_bcci_videos.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          feed_snapshot="$(mktemp)"
          report_snapshot="$(mktemp)"
          cp assets/bcci-videos.json "$feed_snapshot"
          cp assets/bcci-video-refresh-report.json "$report_snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$feed_snapshot" assets/bcci-videos.json
            cp "$report_snapshot" assets/bcci-video-refresh-report.json
            python -m json.tool assets/bcci-videos.json > /dev/null
            python -m json.tool assets/bcci-video-refresh-report.json > /dev/null
            if git diff --quiet -- assets/bcci-videos.json assets/bcci-video-refresh-report.json; then
              echo "No changes to the BCCI video feed or refresh report."
              exit 0
            fi
            git add assets/bcci-videos.json assets/bcci-video-refresh-report.json
            git commit -m "Refresh BCCI Tilak videos and report additions"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update on attempt $attempt; retrying."
            sleep 2
          done
          echo "Unable to publish BCCI video feed after 3 attempts."
          exit 1
