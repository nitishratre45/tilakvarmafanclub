name: Refresh BCCI Fixtures Scorecard JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "bcci-fixtures-test/fetch_bcci_scorecard.py"
      - ".github/workflows/fetch-bcci-scorecard-json.yml"

permissions:
  contents: write

concurrency:
  group: bcci-fixtures-test-scorecard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scorecard fetcher and source JSON
        run: |
          set -euo pipefail
          python -m py_compile bcci-fixtures-test/fetch_bcci_scorecard.py
          python -m json.tool bcci-fixtures-test/bcci-fixtures.json >/dev/null
      - name: Fetch current BCCI scorecard into the BCCI Fixtures folder
        id: fetch
        run: python bcci-fixtures-test/fetch_bcci_scorecard.py
      - name: Validate BCCI scorecard snapshot
        if: steps.fetch.outputs.no_live_match != 'true'
        run: |
          set -euo pipefail
          python -m json.tool bcci-fixtures-test/bcci-scorecard.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("bcci-fixtures-test/bcci-scorecard.json").read_text(encoding="utf-8"))
          assert p.get("status") == "ok", f"scorecard status={p.get('status')!r}"
          assert p.get("matchId"), "numeric matchId missing"
          assert isinstance(p.get("data"), dict) and p["data"], "scorecard data missing"
          print(f"Validated BCCI scorecard for match {p['matchId']} (HTTP {p.get('httpStatus')}).")
          print(f"Innings: {len(p['data'].get('innings') or [])}; teams: {len(p['data'].get('team') or [])}")
          PY
      - name: Commit updated BCCI scorecard JSON only
        if: steps.fetch.outputs.no_live_match != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bcci-fixtures-test/bcci-scorecard.json
          if git diff --cached --quiet; then
            echo "BCCI scorecard JSON unchanged."
            exit 0
          fi
          git commit -m "chore: refresh BCCI Fixtures scorecard JSON"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Scorecard rebase conflict; refusing to publish an unverified merge."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published BCCI Fixtures scorecard JSON."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish BCCI scorecard JSON after retries."
          exit 1
