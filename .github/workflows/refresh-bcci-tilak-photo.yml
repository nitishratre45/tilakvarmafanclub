name: Refresh official BCCI Tilak photo

on:
  workflow_dispatch:
  schedule:
    # Every 30 days, at 09:00 IST
    - cron: "30 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_bcci_tilak_photo.py"
      - ".github/workflows/refresh-bcci-tilak-photo.yml"

permissions:
  contents: write

concurrency:
  group: refresh-bcci-tilak-photo
  cancel-in-progress: false

jobs:
  refresh-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Refresh official BCCI profile image
        run: python scripts/refresh_bcci_tilak_photo.py
      - name: Validate and commit photo snapshot
        run: |
          python -m json.tool data/bcci-tilak-photo.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/bcci-tilak-photo.json; then
            echo "BCCI photo snapshot unchanged."
            exit 0
          fi
          git add data/bcci-tilak-photo.json
          git commit -m "chore: refresh official Tilak Varma BCCI photo"
          git push
