name: Refresh Upcoming Matches from BCCI News JSON
on:
  workflow_dispatch:
  schedule:
    - cron: "29 */12 * * *"
  push:
    branches: [main]
    paths:
      - "News/newsjson.json"
      - "matches/bcci-stats-fixtures.json"
      - "scripts/refresh_upcoming_matches.py"
      - ".github/workflows/refresh-upcoming-matches.yml"
      - "matches/details/**"
      - "matches/match-centre.js"
      - "matches/match-centre.css"
permissions:
  contents: write
concurrency:
  group: refresh-upcoming-matches
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate BCCI News JSON
        run: python -m json.tool News/newsjson.json > /dev/null
      - name: Validate fixture pipeline and page consumers
        run: |
          python -m py_compile scripts/refresh_upcoming_matches.py
          node --check matches/match-centre.js
          node --check matches/upcoming-matches.js
          node --check matches/details/match-details.js
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("refresh_upcoming_matches", "scripts/refresh_upcoming_matches.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.parse_time("") == "", "Missing time must remain unknown"
          assert module.parse_time("TBC") == "", "Unparseable time must remain unknown"
          assert module.parse_time("7:30 PM IST") == "19:30"
          assert module.parse_time("19:30 IST") == "19:30"
          assert module.clean_venue("Bengaluru Rest of India squad:Rishabh Pant") == "Bengaluru"
          assert module.clean_venue("Hamilton DEVAJIT SAIKIA Honorary Secretary") == "Hamilton"
          print("Verified match-time parser and venue cleanup preserve only schedule data.")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          assert isinstance(snapshot.get("fixtures"), list), "Fixture snapshot must contain a fixtures array"
          for fixture in snapshot["fixtures"]:
              for key in ("date", "match", "opponent", "source"):
                  assert str(fixture.get(key, "")).strip(), f"Fixture missing {key}: {fixture}"
          print(f"Validated saved fixture snapshot: {len(snapshot['fixtures'])} fixtures")
          PY
      - name: Refresh canonical JSON read by Match Centre
        run: python scripts/refresh_upcoming_matches.py
      - name: Validate refreshed snapshot and detail route fields
        run: |
          python -m json.tool matches/upcoming-fixtures-refresh.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          assert isinstance(snapshot.get("fixtures"), list), "Fixture snapshot must contain a fixtures array"
          for fixture in snapshot["fixtures"]:
              assert all(str(fixture.get(k, "")).strip() for k in ("date", "match", "opponent", "source"))
          print(f"Live Match Centre JSON is valid: {len(snapshot['fixtures'])} fixtures")
          PY
      - name: Validate refresh report and updated JavaScript
        run: |
          python -m json.tool matches/upcoming-fixtures-refresh.json > /dev/null
          python -m py_compile scripts/refresh_upcoming_matches.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          js = Path("matches/upcoming-matches.js").read_text(encoding="utf-8")
          fixtures = report.get("fixtures", [])
          if report.get("status") != "updated-from-news-and-bcci-json" or not fixtures:
              raise SystemExit("No exact BCCI fixture matches were generated for squad-confirmed News fixtures.")
          bcci = json.loads(Path("matches/bcci-stats-fixtures.json").read_text(encoding="utf-8"))
          bcci_rows = bcci.get("fixtures", [])
          for fixture in fixtures:
              if not str(fixture.get("newsUrl", "")).startswith("/News-details/index.html?id="):
                  raise SystemExit("Fixture is missing its internal Fan Club news link.")
              if fixture.get("tilakInSquad") is not True or fixture.get("confirmationSource") != "BCCI squad announcement naming Tilak Varma":
                  raise SystemExit("Upcoming fixture lacks explicit Tilak squad confirmation.")
              if not str(fixture.get("source", "")).startswith("https://stats.bcci.tv/"):
                  raise SystemExit("Fixture details must come from the BCCI Stats fixture JSON.")
              venue = str(fixture.get("venue", ""))
              if not venue or any(marker in venue.lower() for marker in ("rest of india squad", "honorary secretary", "updated squad")):
                  raise SystemExit("Venue is missing or contains unrelated article text: " + venue)
              sides = {str(fixture.get("team", "")).strip().lower(), str(fixture.get("opponent", "")).strip().lower()}
              exact = [row for row in bcci_rows if str(row.get("date", "")) == str(fixture.get("date", "")) and str(row.get("match", "")).strip().lower() == str(fixture.get("match", "")).strip().lower() and {str(row.get("team", "")).strip().lower(), str(row.get("opponent", "")).strip().lower()} == sides]
              if not exact:
                  raise SystemExit("Fixture does not match a BCCI row exactly: " + repr(fixture))
          if "Match Details ↗" not in js or "upcoming-team-announcement-link" not in js:
              raise SystemExit("Matches page is missing internal news-link UI.")
          print(f"Validated {len(fixtures)} Tilak squad-confirmed fixtures against exact BCCI Stats rows.")
          PY
          git diff --check
      - name: Validate automatic match details and team badge fallback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          fixtures = report.get("fixtures", [])
          details_js = Path("matches/details/match-details.js").read_text(encoding="utf-8")
          details_html = Path("matches/details/index.html").read_text(encoding="utf-8")
          details_css = Path("matches/details/match-details.css").read_text(encoding="utf-8")
          match_js = Path("matches/match-centre.js").read_text(encoding="utf-8")
          required_js = [
              'q.get("date")',
              'q.get("match")',
              'q.get("opponent")',
              'setTeamBadge("details-team-mark-home", a)',
              'setTeamBadge("details-team-mark-away", b)',
              'host.classList.add("details-team-mark-fallback")',
          ]
          missing = [token for token in required_js if token not in details_js]
          if missing:
              raise SystemExit("Match details are not dynamic or logo fallback is missing: " + ", ".join(missing))
          for target in ("details-team-mark-home", "details-team-mark-away"):
              if target not in details_html:
                  raise SystemExit("Match details HTML missing team badge target: " + target)
          if ".details-tabs > a" not in details_css or "flex-wrap: nowrap" not in details_css:
              raise SystemExit("Responsive match details navigation CSS is missing.")
          if "renderTeamLogo(" not in match_js or "upcoming-team-logo-initials" not in match_js:
              raise SystemExit("Upcoming match cards need dynamic team logos and initials fallback.")
          # Accept either the existing inline filter or the equivalent named helper.
          # The user-facing behavior is what matters: unknown times stay for the day;
          # verified times expire four hours after kickoff.
          untimed_supported = (
              ('if (!time)' in match_js and 'return date >= today;' in match_js)
              or ('const hasTime = Boolean(String(fixture.time || "").trim());' in match_js
                  and 'hasTime ? 4 : 24' in match_js)
          )
          if not untimed_supported:
              raise SystemExit("Untimed fixtures must remain visible through their scheduled local date.")
          if not any(token in match_js for token in (
              'start + 4 * 60 * 60 * 1000 > Date.now()',
              'hasTime ? 4 : 24'
          )):
              raise SystemExit("Timed fixtures must remain visible for four hours after their verified start time.")
          keys = set()
          for fixture in fixtures:
              for field in ("date", "match", "opponent"):
                  if not str(fixture.get(field, "")).strip():
                      raise SystemExit("Fixture is missing required detail-route field: " + field)
              key = (fixture["date"], fixture["match"].lower(), fixture["opponent"].lower())
              if key in keys:
                  raise SystemExit("Duplicate upcoming fixture route: " + repr(key))
              keys.add(key)
          print(f"Validated {len(fixtures)} upcoming fixtures can use the shared dynamic details page and logo fallback.")
          PY
          node --check matches/details/match-details.js
          node --check matches/match-centre.js
          git diff --check
      - name: Publish verified fixture snapshot safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/refresh_upcoming_matches.py
            python -m json.tool matches/upcoming-fixtures-refresh.json > /dev/null
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          bcci = json.loads(Path("matches/bcci-stats-fixtures.json").read_text(encoding="utf-8"))
          rows = bcci.get("fixtures", [])
          fixtures = report.get("fixtures", [])
          if report.get("status") != "updated-from-news-and-bcci-json" or not fixtures:
              raise SystemExit("No exact BCCI fixtures available for squad-confirmed upcoming matches.")
          for fixture in fixtures:
              if fixture.get("tilakInSquad") is not True or fixture.get("confirmationSource") != "BCCI squad announcement naming Tilak Varma":
                  raise SystemExit("Fixture is missing explicit Tilak Varma squad confirmation.")
              if not str(fixture.get("newsUrl", "")).startswith("/News-details/index.html?id="):
                  raise SystemExit("Fixture is missing its internal squad-announcement link.")
              if not str(fixture.get("source", "")).startswith("https://stats.bcci.tv/"):
                  raise SystemExit("Fixture schedule is not sourced from BCCI Stats.")
              sides = {str(fixture.get("team", "")).strip().lower(), str(fixture.get("opponent", "")).strip().lower()}
              exact = [
                  row for row in rows
                  if str(row.get("date", "")) == str(fixture.get("date", ""))
                  and str(row.get("match", "")).strip().lower() == str(fixture.get("match", "")).strip().lower()
                  and {str(row.get("team", "")).strip().lower(), str(row.get("opponent", "")).strip().lower()} == sides
              ]
              if not exact:
                  raise SystemExit("Fixture failed exact BCCI date/match/team validation: " + repr(fixture))
          print(f"Validated {len(fixtures)} squad-confirmed fixtures against exact BCCI rows.")
          PY
            git add matches/upcoming-fixtures-refresh.json
            if git diff --cached --quiet; then
              echo "Verified fixture snapshot is already current."
              exit 0
            fi
            git commit -m "chore: refresh verified upcoming fixtures"
            if git push origin HEAD:main; then
              echo "Published verified squad-confirmed fixture snapshot."
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying against latest main."
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish fixture refresh after five attempts."
          exit 1