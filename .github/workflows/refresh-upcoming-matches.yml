name: Refresh Upcoming Matches from BCCI News JSON
on:
  workflow_dispatch:
  schedule:
    - cron: "29 */12 * * *"
  push:
    branches: [main]
    paths:
      - "News/newsjson.json"
      - "scripts/refresh_upcoming_matches.py"
      - ".github/workflows/refresh-upcoming-matches.yml"
permissions:
  contents: write
concurrency:
  group: refresh-upcoming-matches
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate BCCI News JSON
        run: python -m json.tool News/newsjson.json > /dev/null
      - name: Extract squad-confirmed T20I fixtures
        run: python scripts/refresh_upcoming_matches.py
      - name: Validate refresh report and updated JavaScript
        run: |
          python -m json.tool matches/upcoming-fixtures-refresh.json > /dev/null
          python -m py_compile scripts/refresh_upcoming_matches.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("matches/upcoming-fixtures-refresh.json").read_text(encoding="utf-8"))
          js = Path("matches/upcoming-matches.js").read_text(encoding="utf-8")
          fixtures = report.get("fixtures", [])
          if report.get("status") != "updated-from-news-json" or not fixtures:
              raise SystemExit("No verified future squad fixtures were generated.")
          for fixture in fixtures:
              if not str(fixture.get("newsUrl", "")).startswith("/News-details/index.html?id="):
                  raise SystemExit("Fixture is missing its internal Fan Club news link.")
              venue = str(fixture.get("venue", ""))
              if any(marker in venue.lower() for marker in ("rest of india squad", "honorary secretary", "updated squad")):
                  raise SystemExit("Venue contains unrelated article text: " + venue)
          if "Match Details ↗" not in js or "upcoming-team-announcement-link" not in js:
              raise SystemExit("Matches page is missing internal news-link UI.")
          print(f"Validated {len(fixtures)} fixtures and their internal news links.")
          PY
          git diff --check
      - name: Commit fixture list and refresh report when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches/upcoming-matches.js matches/upcoming-fixtures-refresh.json
          if git diff --cached --quiet; then
            echo "No fixture or report changes."
            exit 0
          fi
          git commit -m "chore: refresh upcoming matches from BCCI news"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published verified fixtures extracted from BCCI News JSON."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish fixture refresh after retries."
          exit 1
