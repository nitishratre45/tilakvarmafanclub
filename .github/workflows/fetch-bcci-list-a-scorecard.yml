name: Fetch BCCI 2021 List A Scorecard

on:
  workflow_dispatch:
    inputs:
      match_gid:
        description: "BCCI match GID"
        required: true
        default: "8a4ed6c8-2bf2-417f-82d6-bae2012d611d"

permissions:
  contents: write

jobs:
  fetch-scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Fetch scorecard and update List A JSON
        env:
          BCCI_MATCH_GID: ${{ inputs.match_gid }}
        run: python HYD/fetch_bcci_list_a_scorecard.py
      - name: Commit generated scorecard and List A data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HYD/hyd_scoreboards/json data/list-a.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update List A stats from BCCI scorecard"
            git push
          fi
