name: Browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home/**"
      - "death-overs/**"
      - "news/**"
      - "videos/**"
      - "records/**"
      - "News-details/**"
      - "assets/**"
      - "News-details/**"
      - "News/**"
      - "functions/**"
      - "admin/**"
      - "data/site-data.json"
      - "stats/**"
      - "matches/**"
      - "photos/**"
      - "sw.js"
      - "manifest.json"
      - "tests/**"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-smoke:
    # Safe auto-repair PRs already run deterministic syntax/data checks in self-healing.yml.
    # Skip redundant PR-triggered jobs for github-actions[bot] to avoid approval-gated action_required runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    name: Desktop and mobile interaction checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/tilak-fc-http.log 2>&1 &
          echo $! > /tmp/tilak-fc-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tilak-fc-http.log
          exit 1

      - name: Test real browser interactions
        run: node tests/browser-smoke.mjs

      - name: Upload browser server log if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-server-log
          path: /tmp/tilak-fc-http.log
          if-no-files-found: ignore
