name: Repository health monitor (10 minutes)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/repo_health_monitor.py"
      - ".github/workflows/repo-health-monitor.yml"
      - "matches/details/index.html"
      - "matches/recent-scorecard/index.html"
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-health-monitor
  cancel-in-progress: false
jobs:
  scan:
    name: Scan code, UI references and data
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository
        id: scan
        continue-on-error: true
        run: python scripts/repo_health_monitor.py
      - name: Upload detailed scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-${{ github.run_number }}
          path: data/repo-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish latest report to Admin Studio
        if: always() && hashFiles('data/repo-health.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report_snapshot="$(mktemp)"
          cp data/repo-health.json "$report_snapshot"

          # Other workflows can update main while this scan is running.
          # Rebase the report onto the latest main and retry to avoid stale reports
          # or a non-fast-forward push failure.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$report_snapshot" data/repo-health.json
            git add data/repo-health.json
            if git diff --cached --quiet; then
              echo "Health report unchanged; no report commit needed."
              exit 0
            fi
            git commit -m "chore: publish repository health report"
            if git push origin HEAD:main; then
              echo "Published latest repository health report."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main."
          done
          echo "::error::Could not publish repository health report after 3 attempts."
          exit 1
      - name: Open or update health issue when errors are found
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Repo Health] Automated scan found errors';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const report = JSON.parse(require('fs').readFileSync('data/repo-health.json', 'utf8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const errors = (report.items || []).filter(item => item.level === 'error').slice(0, 30);
            const body = [
              'The scheduled repository health scan found errors that were not automatically rewritten.',
              '',
              `Latest scan: ${report.checkedAt}`,
              `Workflow: ${runUrl}`,
              '',
              ...errors.map(item => `- ${item.file}: ${item.message}`),
              '',
              'Review the workflow logs and fix the underlying issue. A later clean scan will close this tracking issue.',
              'The monitor intentionally does not guess at logic changes or modify cricket data.'
            ].join('\n');
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Close health issue after a clean scan
        if: steps.scan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Repo Health] Automated scan found errors';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `A clean repository scan passed at ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
      - name: Surface scan result
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Repository health scan found errors. Open Admin Studio → Repository health, then inspect this workflow run."
          exit 1
