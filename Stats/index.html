<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Stats Centre · Tilak Varma Fan Club</title>
    <script>
      // Stats/index.html is a partial loaded by the home-page module.
      // If opened directly at /Stats/ (uppercase folder), send the browser
      // to the canonical route. Scripts in fetched template markup stay inert.
      if (window.top === window.self) {
        window.location.replace("/stats" + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <section id="stats" class="section stats-section">
            <div class="section-heading">
              <div>
                <div class="eyebrow">TILAK VARMA · STATS CENTRE</div>
                <h2><em>STATS</em></h2>
              </div>
            </div>
            <div class="stats-subnav" role="tablist" aria-label="Stats sections">
              <button
                type="button"
                class="active"
                role="tab"
                aria-selected="true"
                data-stats-tab="stats-overview"
              >
                Batting
              </button>
              <button type="button" role="tab" aria-selected="false" data-stats-tab="stats-bowling">
                Bowling
              </button>
              <button type="button" role="tab" aria-selected="false" data-stats-tab="statsguru">
                Explore
              </button>
            </div>
                    <div id="stats-subview-mounts">
              <div data-stats-partial="/Stats/Batting/index.html" aria-live="polite"></div>
              <div data-stats-partial="/Stats/Explore/index.html" aria-live="polite"></div>
              <div data-stats-partial="/Stats/Bowling/index.html" aria-live="polite"></div>
            </div>
          </section>
  </body>
</html>
