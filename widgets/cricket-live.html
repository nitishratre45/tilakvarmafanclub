<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Live Cricket Score Widget</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 300px; overflow-x: hidden; background: #fff; }
    body { display: flex; justify-content: center; align-items: flex-start; }
    .widget-root { width: 100%; min-height: 300px; overflow: hidden; }
  </style>
</head>
<body>
  <main class="widget-root" aria-label="Third-party live cricket scores">
    <script src="https://cdorgapi.b-cdn.net/widgets/matchlist.js"></script>
  </main>
</body>
</html>
