<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a42" />
    <title>Tilak Varma Fan Club | Match Results</title>
    <link rel="stylesheet" href="./results.css" />
      <link rel="stylesheet" href="../ui/site-nav.css?v=20261016-tvfc-shell1" />
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <p class="eyebrow">TILAK VARMA FAN CLUB · BCCI</p>
          <h1>Match Results</h1>
          <p class="sub">
            Completed matches fetched from the official BCCI Stats results endpoint.
          </p>
        </div>
        <a class="back" href="../index.html">← BCCI Centre</a>
      </div>
      <div class="tools">
        <input
          id="search"
          type="search"
          placeholder="Search team, competition or venue…"
          aria-label="Search results"
        /><select id="format" aria-label="Filter by format">
          <option value="all">All formats</option>
          <option>Test</option>
          <option>ODI</option>
          <option>T20I</option>
          <option>Women's</option>
          <option>Other</option></select
        ><select id="sort" aria-label="Sort results">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
        </select>
      </div>
      <div class="summary">
        <span id="count">Loading saved results…</span><span id="updated"></span>
      </div>
      <div id="list" class="list" aria-live="polite"><div class="empty">Loading results…</div></div>
      <p class="foot">
        Data is stored inside <code>bcci-fixtures-test/results/</code>. Results are deduplicated by
        BCCI match ID.
      </p>
    </main>
    <script src="./results.js" defer></script>
      <script src="../ui/site-nav.js?v=20261016-tvfc-shell1" defer></script>
  </body>
</html>
