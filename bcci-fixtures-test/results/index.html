<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a42" />
    <title>Tilak Varma Fan Club | Completed Matches</title>
    <link rel="stylesheet" href="./results.css?v=20261016-matches-ui3" />
    <link rel="stylesheet" href="../ui/site-nav.css?v=20261016-main-menu-grid7" />
  </head>
  <body>
    <header class="tvfc-header">
      <a class="tvfc-brand" href="/" aria-label="Tilak Varma Fan Club home"
        ><span class="tvfc-brand-photo"
          ><img
            src="https://images.icc-cricket.com/image/upload/t_player-headshot-portrait-lg-webp/prd/assets/players/generic/colored/70761.png"
            alt="Tilak Varma" /></span
        ><span>TILAK VARMA<small>FAN CLUB · THE 72 CLUB</small></span></a
      >
    </header>
    <main>
      <div class="top">
        <div>
          <p class="eyebrow">TILAK VARMA FAN CLUB · BCCI</p>
          <h1>Tilak Varma · Completed Matches</h1>
          <p class="sub">
            Only completed matches featuring Tilak Varma, loaded from the Matches folder’s verified scorecard archive. Each card opens its own match scorecard.
          </p>
        </div>
        <a class="back" href="../index.html">← BCCI Centre</a>
      </div>
      <div class="tools">
        <input
          id="search"
          type="search"
          placeholder="Search team, competition or venue…"
          aria-label="Search results"
        /><select id="format" aria-label="Filter by format">
          <option value="all">All formats</option>
          <option value="T20I">T20 International</option>
          <option value="ODI">ODI</option>
          <option value="Test">Test</option>
          <option value="T20">T20 / IPL</option>
          <option value="List A">List A</option>
          <option value="First-class">First-class</option>
          <option value="Other">Other</option></select
        ><select id="sort" aria-label="Sort results">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
        </select>
      </div>
      <div class="summary">
        <span id="count">Loading saved results…</span><span id="updated"></span>
      </div>
      <div id="list" class="list" aria-live="polite"><div class="empty">Loading results…</div></div>
      
    </main>
    <script src="./results.js?v=20261016-matches-ui3" defer></script>
    <script src="../ui/site-nav.js?v=20261016-main-menu-grid7" defer></script>
