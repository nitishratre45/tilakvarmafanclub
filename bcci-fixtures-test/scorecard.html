<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5fc4" />
    <title>Tilak Varma Fan Club | Match Scorecard</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./scorecard.css" />
    <script src="./scorecard.js" defer></script>
    <link rel="stylesheet" href="./ui/site-nav.css?v=20261016-main-menu-grid7" />

    <!-- Shared main-site visual system: header, glass menu, dock, responsive layout and motion. -->
    <link rel="stylesheet" href="/assets/mobile-glass-menu.css?v=20261017-mobile-performance2" />
    <link rel="stylesheet" href="/assets/india-cricket-theme.css?v=20261017-mobile-performance2" />
    <link rel="stylesheet" href="/assets/mobile-bottom-nav.css?v=20261017-mobile-performance2" />
    <link
      rel="stylesheet"
      href="/assets/mobile-responsive-polish.css?v=20261017-mobile-performance2"
    />
    <link rel="stylesheet" href="/assets/custom-selects.css?v=20261017-mobile-performance2" />
    <link rel="stylesheet" href="/matches/matches-motion.css?v=20261017-mobile-performance2" />
    <link rel="stylesheet" href="/assets/site-loading-media.css?v=20261017-spinner-nav1" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html"
        ><span class="brand-mark">C</span
        ><span>Tilak Varma Fan Club <small>MATCH CENTRE</small></span></a
      ><span class="test-label"><i></i> MATCH DATA</span>
    </header>
    <main class="container scorecard-container">
      <a class="scorecard-back" href="./index.html">← Back to Matches</a>
      <section class="scorecard-hero">
        <p class="eyebrow">MATCH SCORECARD</p>
        <div class="scorecard-status" id="matchStatus">Loading match…</div>
        <div class="scorecard-teams">
          <div class="scorecard-team">
            <span class="scorecard-flag" id="flagA">🇮🇳</span>
            <h1 id="teamA">Team 1</h1>
            <strong id="scoreA">—</strong><small id="oversA"></small>
          </div>
          <span class="scorecard-vs">VS</span>
          <div class="scorecard-team scorecard-team-right">
            <span class="scorecard-flag" id="flagB">🏏</span>
            <h1 id="teamB">Team 2</h1>
            <strong id="scoreB">—</strong><small id="oversB"></small>
          </div>
        </div>
        <p class="scorecard-match-name" id="matchName"></p>
        <p class="scorecard-venue" id="venue"></p>
      </section>
      <nav class="scorecard-tabs" aria-label="Match sections">
        <button class="active" data-tab="scorecard">▤ Scorecard</button
        ><button data-tab="commentary">◉ Commentary</button><button data-tab="stats">▥ Stats</button
        ><button data-tab="details">▣ Match Details</button>
      </nav>
      <section class="scorecard-content" id="tabContent">
        <h2>Scorecard</h2>
        <p class="scorecard-note">Loading innings information…</p>
      </section>
    </main>
    <script src="./ui/site-nav.js?v=20261016-main-menu-grid7" defer></script>

    <script src="/assets/mobile-glass-menu.js?v=20261017-mobile-performance2" defer></script>
    <script src="/assets/mobile-bottom-nav.js?v=20261017-spinner-nav1" defer></script>
    <script src="/assets/site-loading-media.js?v=20261017-spinner-nav1" defer></script>
  </body>
</html>
