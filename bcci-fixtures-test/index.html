<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Tilak Varma Fan Club | BCCI Fixtures</title>
    <link rel="stylesheet" href="./styles.css?v=20261016-bcci-complete1" />
    <script src="./app.js?v=20261016-team-logos1" defer></script>
    <link rel="stylesheet" href="./ui/site-nav.css?v=20261016-glassfix8" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"
        ><span class="brand-mark">72</span
        ><span>Tilak Varma Fan Club <small>BCCI FIXTURES</small></span></a
      >
      <span class="test-label"><i></i> BCCI DATA</span>
    </header>
    <main class="container">
      <section class="live-refresh-strip panel" aria-live="polite">
        <span class="live-refresh-dot" aria-hidden="true"></span>
        <div><strong id="liveRefreshTitle">Live-aware updates</strong><p id="liveRefreshMessage">Automatic refresh stays idle when no match is live.</p></div>
        <span id="liveRefreshState" class="live-refresh-badge">Standby</span>
      </section>
      <section class="filters panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">EXPLORE DATA</p>
            <h2>Fixtures</h2>
          </div>
          <span id="resultCount" class="result-count">Loading…</span>
        </div>
        <div class="filter-row">
          <label class="search-box"
            ><span>⌕</span
            ><input
              id="searchInput"
              type="search"
              placeholder="Search team, venue, competition…"
              autocomplete="off"
          /></label>
          <select id="statusFilter" aria-label="Filter by match status">
            <option value="all">All statuses</option>
          </select>
          <select id="sortFilter" aria-label="Sort fixtures">
            <option value="date-asc">Date: earliest first</option>
            <option value="date-desc">Date: latest first</option>
          </select>
        </div>
        <div id="fixtureList" class="fixture-list" aria-live="polite">
          <div class="loading-state">Loading saved BCCI fixtures…</div>
        </div>
        <div id="emptyState" class="empty-state" hidden>
          <span>⌕</span>
          <h3>No fixtures found</h3>
          <p>Try another search or status filter.</p>
        </div>
      </section>
      <footer>
        <span>Independent test view · Not official BCCI output</span>
      </footer>
    </main>
    <script src="./ui/site-nav.js?v=20261016-glassfix8" defer></script>
  </body>
</html>
